<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081a36">
  <title>メンテナンスのお知らせ｜翠央1周年</title>
  <style>
    * {box-sizing:border-box}
    html,body {margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",system-ui,sans-serif}
    body {min-height:100svh;display:grid;place-items:center;padding:20px;background:#08162c;color:#f5fbff;position:relative;isolation:isolate}
    body::before {content:"";position:fixed;inset:0;z-index:-2;background:url("/assets/mio-bg-princess.jpg") center top/cover no-repeat;opacity:.4}
    body::after {content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#041127e3,#081a33ba 44%,#041128f0)}
    main {width:min(100%,560px);background:#071c3cdd;border:1px solid #b5e3ff72;border-radius:24px;text-align:center;padding:clamp(25px,6vw,46px) clamp(20px,5vw,40px);box-shadow:0 18px 50px #0009;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .eyebrow {font-weight:800;color:#ffe1a4;letter-spacing:.13em;font-size:12px}
    .ornament {font-size:40px;color:#ffe1a4;margin:15px 0 2px}
    h1 {font-size:clamp(24px,6vw,32px);line-height:1.5;margin:12px 0 22px}
    p {font-size:clamp(14px,3.7vw,16px);line-height:1.95;color:#e0f2ff}
    .notice {border:1px solid #bde9ff7a;background:#123662b8;border-radius:16px;padding:20px 16px;margin:24px 0}
    .notice strong {display:block;color:#ffe6b1;line-height:1.75;font-size:clamp(16px,4vw,19px)}
    .notice p {margin:11px 0 0}
    footer {margin-top:25px;font-size:11px;color:#a9cce4;letter-spacing:.04em}
  </style>
</head>
<body>
<main>
  <div class="eyebrow">MIO · 1ST ANNIVERSARY</div>
  <div class="ornament" aria-hidden="true">✦</div>
  <h1>ただいまメンテナンス中です</h1>
  <p>翠央1周年イベントシステムをご利用いただき、ありがとうございます。<br>現在、システム調整のため一時的にご利用を停止しております。</p>
  <section class="notice" aria-label="メンテナンス時間のお知らせ">
    <strong>メンテナンス終了は19:00を予定しています。</strong>
    <p>19:00以降も続く場合、終了時刻は未定となります。</p>
  </section>
  <p>ご利用の皆さまにはご不便をおかけしてしまい、申し訳ございません。<br>何卒ご理解いただきますようお願いいたします。</p>
  <footer>翠央1周年イベントシステム · 運営からのお知らせ</footer>
</main>
</body>
</html>
