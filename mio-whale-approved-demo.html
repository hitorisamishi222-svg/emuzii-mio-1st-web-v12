<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061938"><title>翠央1周年｜ジュエリーガチャクジラ 2.5D</title>
<style>
:root{color-scheme:dark;--a:#8ceaff;--gold:#ffdb82;--ink:#e8f8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 25%,#164b83 0,#081d43 48%,#030e26 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",system-ui,sans-serif;min-height:100svh}
.wrap{max-width:760px;margin:auto;padding:20px 14px max(32px,env(safe-area-inset-bottom))}
header{text-align:center}h1{margin:4px 0 5px;font-size:clamp(20px,5.2vw,30px);letter-spacing:.025em}header p{font-size:13px;color:#c1eaff;margin:6px 0 16px;line-height:1.65}
.stage{position:relative;width:100%;aspect-ratio:772/482;border-radius:22px;overflow:hidden;isolation:isolate;background:#1b4d82;box-shadow:0 10px 36px #0008,0 0 0 1px #a9eaff88}
.whale{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,#ffffff13,transparent 36%,#00000010 100%)}
.hopper{position:absolute;left:47.8%;top:25%;width:35.5%;height:44%;border-radius:49%;pointer-events:none;overflow:hidden}
.hopper .beam{position:absolute;inset:-20%;opacity:0;background:conic-gradient(from 0deg,transparent 0 25%,#ffffff55 35%,transparent 45% 75%,#8dfbff66 88%,transparent);mix-blend-mode:screen}
.stage.running .beam{opacity:.8;animation:rotate 2.4s linear infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
.spark{position:absolute;width:8px;height:8px;background:#fff;transform:rotate(45deg);opacity:0;box-shadow:0 0 10px #a8f7ff;pointer-events:none}
.s1{left:55%;top:35%}.s2{left:69%;top:48%}.s3{left:78%;top:41%}.s4{left:61%;top:59%}
.stage.running .spark{animation:twinkle .85s ease-in-out infinite alternate}.stage.running .s2{animation-delay:-.2s}.stage.running .s3{animation-delay:-.55s}.stage.running .s4{animation-delay:-.35s}
@keyframes twinkle{to{opacity:1;transform:rotate(45deg) scale(1.5)}}
.chute{position:absolute;left:68%;top:84%;width:13%;height:12%;display:grid;place-items:center;pointer-events:none}
.capsule{width:clamp(19px,5.8vw,42px);height:clamp(19px,5.8vw,42px);border-radius:50%;opacity:0;transform:translateY(-24px) scale(.35);background:linear-gradient(#d4faffbb 0 47%,#fff 48% 51%,#5aa9f3dd 52%);border:2px solid #fff;box-shadow:inset -5px -5px 8px #135aa5,0 0 13px #b8f5ff}
.capsule::before{content:"";position:absolute;left:20%;top:12%;width:28%;height:16%;background:#fff;border-radius:50%;transform:rotate(-25deg)}
.stage.prize .capsule{animation:pop 1.15s cubic-bezier(.25,.8,.25,1) both}
@keyframes pop{0%{opacity:0;transform:translateY(-24px) scale(.35) rotate(-25deg)}24%{opacity:1;transform:translateY(12px) scale(1.12,.88) rotate(20deg)}50%{transform:translateY(-8px) scale(.95,1.04) rotate(-9deg)}72%{transform:translateY(3px) scale(1.03,.97) rotate(5deg)}100%{opacity:1;transform:translateY(0) scale(1)}}
.badge{position:absolute;top:8%;right:5%;font-size:clamp(11px,2.8vw,18px);padding:5px 10px;border-radius:99px;background:#071f4d99;border:1px solid #b8f3ff99;opacity:0;transform:scale(.8);font-weight:900;letter-spacing:.07em}
.stage.prize .badge:not([hidden]){opacity:1;transform:scale(1);transition:.35s ease}
.stage[data-rarity=UR] .badge,.stage[data-rarity=LUCKY_UR] .badge{background:linear-gradient(100deg,#7144aa,#c763c8,#f3c76b);color:white;box-shadow:0 0 18px #e2aaffaa}
.stage[data-rarity=SR] .badge{background:#b47d29;color:#fff}
.controls{margin:18px 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
button{border:1px solid #ffffffb0;border-radius:13px;padding:14px 2px;font-size:clamp(12px,3.2vw,17px);font-weight:900;color:#0a2b5b;background:linear-gradient(135deg,#f2fdff,#a2dafa);box-shadow:inset 0 1px #fff9,0 5px 14px #0004;cursor:pointer;touch-action:manipulation}
button:nth-child(4){background:linear-gradient(135deg,#ffe3fa,#d0a2fb)}button:nth-child(5){background:linear-gradient(135deg,#fff2b6,#f6c76d)}
button:disabled{opacity:.55;cursor:wait}button:focus-visible{outline:3px solid #ffda7a;outline-offset:3px}
.status{margin:15px 0 0;text-align:center;min-height:3em;font-size:clamp(14px,3.7vw,19px);font-weight:750;line-height:1.6}
.small{text-align:center;font-size:12px;line-height:1.7;color:#bbdcf5;margin:12px 0 0}
.actions{display:flex;justify-content:center;gap:10px;margin:15px auto 0}.actions button{font-size:12px;padding:10px 14px;background:#0e4176;color:#eafaff}
@media(prefers-reduced-motion:reduce){.stage.running .beam,.stage.running .spark,.stage.prize .capsule{animation:none!important}.stage.prize .capsule{opacity:1;transform:none}}
@media(max-width:390px){.stage.running .spark.s3,.stage.running .spark.s4{display:none}}
</style></head><body><main class="wrap">
