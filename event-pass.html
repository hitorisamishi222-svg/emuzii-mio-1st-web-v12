<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2c51"><title>イベント参加証 | 翠央1周年</title>
<link rel="stylesheet" href="/style.css"><style>
.pass-wrap{max-width:600px;margin:24px auto;padding:16px}.pass-wrap section{margin:12px 0;padding:18px;border:1px solid #7ba9d2;border-radius:18px;background:#102d4d;color:#fff}
.pass-wrap input{font-size:18px;width:100%;min-height:44px;padding:8px;margin:8px 0 12px;box-sizing:border-box}.pass-wrap label{display:block;font-weight:600}
.pass-wrap button{min-height:48px;margin:4px;padding:9px 16px}.pass-wrap p{line-height:1.6}
#eventPassCode{letter-spacing:.25em}.pass-muted{opacity:.83}.pass-result{font-size:19px;font-weight:bold}
</style></head><body><main class="pass-wrap"><a href="/">← 企画ページへ戻る</a>
<h1>イベント参加証</h1>
<p>メールを確認したら、参加条件を満たすイベントにはその場で入場できます。</p>
<section id="eventPassInfo"><h2>参加するイベント</h2>
<p id="eventPassEventLabel" class="pass-result">イベントを確認しています…</p>
<p class="pass-muted">この参加証はイベントの入場用です。ガチャ回数・投票権・景品は別の条件で管理します。</p></section>
<section><h2>① メールアドレスを確認</h2>
<label for="eventPassEmail">メールアドレス</label><input id="eventPassEmail" type="email" autocomplete="email" maxlength="254" placeholder="例：example@gmail.com">
<button type="button" id="eventPassSendCode" disabled>6桁コードを送る</button>
<p class="pass-muted">メールの確認コードを、下の欄に入力してください。メールのリンクで別ブラウザへ移動する必要はありません。</p>
<label for="eventPassCode">届いた6桁コード</label><input id="eventPassCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
<button type="button" id="eventPassVerify" disabled>確認してイベントに参加する</button></section>
<section><h2>② 参加証</h2>
<label for="eventPassInvite">招待コード（招待制イベントのみ）</label><input id="eventPassInvite" autocomplete="off" maxlength="80" placeholder="招待制の方だけ入力">
<button type="button" id="eventPassIssue" disabled>参加証を発行・確認する</button>
<p id="eventPassMessage" role="status" aria-live="polite">メール確認後、自動で参加証を発行します。</p>
<p id="eventPassTicket" class="pass-result" hidden></p><p><a id="eventPassRoomLink" href="/event-pass.html" hidden>イベント会場へ入る</a></p>
<p class="pass-muted">メール認証はイベント入場用です。既存のMIO-IDへの接続やメンシプ資格の判定には別の確認が必要です。</p></section>
</main><script type="module" src="/mio-event-pass-ui.js"></script></body></html>
