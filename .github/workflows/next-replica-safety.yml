name: Large Update Replica Safety
on:
  push:
    branches:
      - 'release/v2-next-integrated-replica'
      - 'feature/next-sparkle-ux-20261009'
  pull_request:
    paths:
      - 'release-prep/**'
      - 'security/**'
      - 'community-policy*'
      - 'vercel.json'
      - 'next-sparkle.css'
      - 'next-premium-v2.css'
      - '*-demo.html'
      - 'next-preview.html'
      - '*-deluxe-demo.html'
permissions:
  contents: read
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static preview safety gate
        run: node --test release-prep/replica-safety.test.mjs release-prep/community-test-schema.test.mjs release-prep/test-device-transfer-schema.test.mjs release-prep/premium-content-visuals.test.mjs
      - name: Security & community rules
        run: node --test security/guard.test.js security/authorization.test.js security/test-device-session.test.js security/test-device-transfer.test.js community-policy.test.js
