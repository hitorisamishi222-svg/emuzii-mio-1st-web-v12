name: MIO web admin October live-source safety
on:
  push:
    branches:
      - feature/mio-onsite-october-admin-integration-20261106
  pull_request:
    paths:
      - GAS_Code_OCTOBER_WITH_ADMIN_OPS_20261106.gs
      - GAS_WebAdminOps_20261030.gs
      - mio-admin-ops-code-copy-20261106.html
      - api-gacha-admin-ops.js
      - tests/mio-web-admin-october-combined.test.mjs
      - tests/mio-admin-livedata-shape-readonly.test.mjs
      - .github/workflows/mio-web-admin-october-safe.yml
      - tools/mio-gas-connection-target-audit.mjs
      - tests/mio-gas-connection-target-audit.test.mjs
      - tools/mio-gas-deployed-version-audit.mjs
      - tests/mio-gas-deployed-version-audit.test.mjs
      - tools/mio-audit-schema-migration-plan.mjs
      - tests/mio-audit-schema-migration-plan.test.mjs
      - tools/mio-audit-schema-sheets-preflight.mjs
      - tests/mio-audit-schema-sheets-preflight.test.mjs
      - tools/mio-operator-reconciliation.mjs
      - tests/mio-operator-reconciliation.test.mjs
      - tests/mio-operator-reconciliation-ui.test.mjs
      - gacha-admin-ops.js
      - gacha-web-gate.html
      - gacha-admin-preview.html
      - tests/mio-admin-preview-no-network.test.mjs
      - tests/mio-gas-live-invalid-identity-repro.test.mjs
      - tools/mio-gas-operator-dispatch-preflight.mjs
      - tests/mio-gas-operator-dispatch-preflight.test.mjs
      - tools/mio-gas-live-source-audit.mjs
      - tests/mio-live-source-preflight.test.mjs
      - tools/mio-attendance-month-plan.mjs
      - tests/mio-attendance-month-plan.test.mjs
      - mio-attendance-admin-preview.html
      - mio-attendance-admin-preview.js
      - tests/mio-attendance-admin-preview.test.mjs
      - vercel.json
      - gas-live-version-inspector.html
      - tests/mio-gas-offline-inspector.test.mjs
permissions:
  contents: read
jobs:
  preserve-live-october-then-admin:
    runs-on: ubuntu-latest
    name: Exact October Code.gs preservation + authenticated Ops
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Basic syntax checks
        run: |
          node --check --input-type=commonjs < GAS_Code_OCTOBER_WITH_ADMIN_OPS_20261106.gs
          node --check --input-type=commonjs < GAS_WebAdminOps_20261030.gs
          node --check tests/mio-web-admin-october-combined.test.mjs
          node --check tests/mio-admin-livedata-shape-readonly.test.mjs
          node --check tests/mio-web-admin-schema-gate.test.mjs
          node --check tests/mio-gas-connection-target-audit.test.mjs
          node --check tools/mio-gas-connection-target-audit.mjs
          node --check tests/mio-gas-deployed-version-audit.test.mjs
          node --check tools/mio-gas-deployed-version-audit.mjs
          node --check tools/mio-audit-schema-migration-plan.mjs
          node --check tests/mio-audit-schema-migration-plan.test.mjs
          node --check tools/mio-audit-schema-sheets-preflight.mjs
          node --check tests/mio-audit-schema-sheets-preflight.test.mjs
          node --check tools/mio-operator-reconciliation.mjs
          node --check tests/mio-operator-reconciliation.test.mjs
          node --check tests/mio-operator-reconciliation-ui.test.mjs
          node --check gacha-admin-ops.js
          node --check tests/mio-admin-preview-no-network.test.mjs
          node --check tests/mio-gas-live-invalid-identity-repro.test.mjs
          node --check tools/mio-gas-operator-dispatch-preflight.mjs
          node --check tests/mio-gas-operator-dispatch-preflight.test.mjs
          node --check tools/mio-gas-live-source-audit.mjs
          node --check tests/mio-live-source-preflight.test.mjs
          node --check tools/mio-attendance-month-plan.mjs
          node --check tests/mio-attendance-month-plan.test.mjs
          node --check mio-attendance-admin-preview.js
          node --check tests/mio-attendance-admin-preview.test.mjs
          node --check tests/mio-gas-offline-inspector.test.mjs
      - name: Offline-only read and approved baseline preservation
        run: node --test tests/mio-web-admin-october-combined.test.mjs tests/mio-admin-livedata-shape-readonly.test.mjs tests/mio-web-admin-schema-gate.test.mjs tests/mio-gas-connection-target-audit.test.mjs tests/mio-gas-deployed-version-audit.test.mjs tests/mio-audit-schema-migration-plan.test.mjs tests/mio-audit-schema-sheets-preflight.test.mjs tests/mio-operator-reconciliation.test.mjs tests/mio-operator-reconciliation-ui.test.mjs tests/mio-admin-preview-no-network.test.mjs tests/mio-gas-live-invalid-identity-repro.test.mjs tests/mio-gas-operator-dispatch-preflight.test.mjs tests/mio-live-source-preflight.test.mjs tests/mio-gas-offline-inspector.test.mjs tests/mio-attendance-month-plan.test.mjs tests/mio-attendance-admin-preview.test.mjs

      - name: Production API gate availability (unauthenticated read-only probe)
        run: node tools/mio-production-admin-readiness-probe.mjs
