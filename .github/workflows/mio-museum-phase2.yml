name: Museum phase 2 scoped validation
on:
  pull_request:
    branches:
      - release/mio-museum-phase1-20261028
    paths:
      - 'museum*'
      - 'api-museum-exhibits.js'
      - 'api-museum-image.js'
      - 'api-museum-assets.js'
      - 'db/museum-public-exhibits.sql'
      - 'gallery-manage.html'
      - 'vercel.json'
      - 'robots.txt'
      - 'tests/mio-museum-phase1.test.mjs'
      - 'tests/mio-museum-phase2.test.mjs'
      - 'tests/mio-museum-image.test.mjs'
      - 'tests/mio-museum-trash-audit.test.mjs'
      - 'tests/mio-museum-curate-ux.test.mjs'
      - 'tests/mio-museum-device-check.test.mjs'
      - 'tests/mio-museum-auth-path.test.mjs'
      - 'tests/mio-museum-chromium-smoke.mjs'
      - '.github/workflows/mio-museum-phase2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check api-museum-exhibits.js
          node --check api-museum-image.js
          node --check api-museum-assets.js
          node --check museum-image-client.js
          node --check museum-device-check.js
          node --check museum-exhibits-core.js
          node --check museum-archive.js
      - name: Museum phase 1 and 2 contracts
        run: node --test tests/mio-museum-phase1.test.mjs tests/mio-museum-phase2.test.mjs tests/mio-museum-image.test.mjs tests/mio-museum-trash-audit.test.mjs tests/mio-museum-curate-ux.test.mjs tests/mio-museum-device-check.test.mjs tests/mio-museum-auth-path.test.mjs
      - name: Real Chromium small-screen and owner interaction test (fixture only)
        timeout-minutes: 2
        run: |
          command -v google-chrome || command -v chromium
          node tests/mio-museum-chromium-smoke.mjs
      - name: Save Chrome screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mio-museum-chromium-mobile-evidence
          path: artifacts/local-museum-*.png
          if-no-files-found: ignore
          retention-days: 7
