name: Gacha draw acknowledgment contract

on:
  push:
    branches: [feature/mio-royal-gacha-deluxe-20261023]
    paths:
      - 'gacha-page.js'
      - 'tests/gacha-browser-ack-contract.mjs'
      - '.github/workflows/gacha-browser-ack-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ack-contract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run only new HTTP 200 body validation cases
        run: node tests/gacha-browser-ack-contract.mjs
