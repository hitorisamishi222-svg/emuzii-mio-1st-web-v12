name: Production Cookie Hotfix Tests
on:
  push:
    branches:
      - hotfix/prod-cookie-retention-v198-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Regression tests
        run: node --test release-prep/session-cookie-rolling-v198.test.mjs
