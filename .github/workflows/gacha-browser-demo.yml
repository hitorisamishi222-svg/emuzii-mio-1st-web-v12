name: Gacha mobile demo browser checks

on:
  push:
    branches:
      - feature/mio-royal-gacha-deluxe-20261023
    paths:
      - 'tests/gacha-browser-demo.mjs'
      - '.github/workflows/gacha-browser-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for isolated local preview only
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static server and verify phone viewport without API access
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gacha-static-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/gacha.html > /dev/null; then break; fi
            sleep 1
          done
          node tests/gacha-browser-demo.mjs
