name: Verify v1.8.8 Release Candidate

on:
  push:
    branches:
      - feature/v1.8.8-gacha-no-duplicates
    paths:
      - .github/workflows/verify-v188-release-candidate.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed candidate hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs)" = "6e1ca0061979da1c7e02bd2ed3545e434b28bb84"
          test "$(git hash-object APPS_SCRIPT_GachaAdmin_v1.8.8.gs)" = "be7d3cc5078dbe133c298f10c5a06c371c0622a5"
          test "$(git hash-object APPS_SCRIPT_DeviceRecovery_v1.8.8.gs)" = "404fe2a0c5b6066ee68a3a5d301ff3aac6c3eeb1"
          test "$(git hash-object gacha-page.v1.8.8_PREP.js)" = "84a9c55a7515560836d53a2c534ceeaf589d9b0d"
      - name: Verify syntax
        shell: bash
        run: |
          set -euo pipefail
          cp APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs /tmp/core.js
          cp APPS_SCRIPT_GachaAdmin_v1.8.8.gs /tmp/admin.js
          cp APPS_SCRIPT_DeviceRecovery_v1.8.8.gs /tmp/recovery.js
          node --check /tmp/core.js
          node --check /tmp/admin.js
          node --check /tmp/recovery.js
          node --check gacha-page.v1.8.8_PREP.js
      - name: Verify safety requirements
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'SECONDARY_SHEET_ID|BACKUP_SWEEP_MINUTES|setupBackupV187_|verifyBackupV187_|backupAfter|backupMirror|backupAppend_' APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs APPS_SCRIPT_GachaAdmin_v1.8.8.gs APPS_SCRIPT_DeviceRecovery_v1.8.8.gs
          ! grep -E '^function[[:space:]]+backupSweep_' APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs APPS_SCRIPT_GachaAdmin_v1.8.8.gs APPS_SCRIPT_DeviceRecovery_v1.8.8.gs
          grep -q 'CHECKIN_MAX_ATTEMPTS = 2' APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs
          grep -q 'webActualLastRow_' APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs
          grep -q 'participantCatalog_' APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs
          grep -q "typeof gachaOpenState_==='function'" APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs
          grep -q 'historySaved=true' APPS_SCRIPT_GachaAdmin_v1.8.8.gs
          grep -q "typeof GACHA_ADMIN_TAB==='undefined'" APPS_SCRIPT_DeviceRecovery_v1.8.8.gs
          grep -q 'backupTriggerCount:backupCount' APPS_SCRIPT_DeviceRecovery_v1.8.8.gs
