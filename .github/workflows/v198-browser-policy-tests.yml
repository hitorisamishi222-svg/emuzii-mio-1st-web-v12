name: v1.9.8 isolated browser policy tests

on:
  pull_request:
    paths:
      - 'release-prep/v198-browser-*.mjs'
      - '.github/workflows/v198-browser-policy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pure policy tests (no external services)
        run: node --test release-prep/v198-browser-*.test.mjs
