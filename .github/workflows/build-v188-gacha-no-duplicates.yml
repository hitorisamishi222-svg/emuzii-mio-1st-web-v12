name: Build v1.8.8 No Duplicate Gacha

on:
  push:
    branches:
      - feature/v1.8.8-gacha-no-duplicates
    paths:
      - .github/workflows/build-v188-gacha-no-duplicates.yml
      - tools/build_v188_gacha_no_duplicates.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate v1.8.8 core
        run: python tools/build_v188_gacha_no_duplicates.py
      - name: Validate generated core
        shell: bash
        run: |
          set -euo pipefail
          cp APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs /tmp/v188.js
          node --check /tmp/v188.js
          ! grep -E 'SECONDARY_SHEET_ID|setupBackupV187_|verifyBackupV187_|backupAfter|backupMirror|backupAppend_' APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs
          grep -q 'wonDuplicateKeys_' APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs
          grep -q '獲得可能な景品がありません' APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs
      - name: Commit generated files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs V1.8.8_GACHA_NO_DUPLICATES_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Prepare v1.8.8 no-duplicate gacha update'
          git push
