name: Build v1.8.8 Gacha Operations Prep

on:
  push:
    branches:
      - feature/v1.8.8-gacha-no-duplicates
    paths:
      - .github/workflows/build-v188-gacha-no-duplicates.yml
      - tools/build_v188_gacha_no_duplicates.py
      - tools/prepare_v188_gacha_admin_controls.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate v1.8.8 no-duplicate core
        run: python tools/build_v188_gacha_no_duplicates.py

      - name: Generate v1.8.8 admin controls prep
        run: python tools/prepare_v188_gacha_admin_controls.py

      - name: Validate Apps Script syntax
        shell: bash
        run: |
          set -euo pipefail
          cp APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs /tmp/v188-core.js
          cp APPS_SCRIPT_GachaAdmin_v1.8.8.gs /tmp/v188-admin.js
          cp APPS_SCRIPT_DeviceRecovery_v1.8.8.gs /tmp/v188-recovery.js
          node --check /tmp/v188-core.js
          node --check /tmp/v188-admin.js
          node --check /tmp/v188-recovery.js
          node --check gacha-page.v1.8.8_PREP.js

      - name: Validate v1.8.8 requirements
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'SECONDARY_SHEET_ID|setupBackupV187_|verifyBackupV187_|backupAfter|backupMirror|backupAppend_' APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs APPS_SCRIPT_GachaAdmin_v1.8.8.gs APPS_SCRIPT_DeviceRecovery_v1.8.8.gs
          grep -q 'wonDuplicateKeys_' APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs
          grep -q '獲得可能な景品がありません' APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs
          grep -q "GACHA_NORMAL_SWITCH='J17'" APPS_SCRIPT_GachaAdmin_v1.8.8.gs
          grep -q "GACHA_FEST_SWITCH='J18'" APPS_SCRIPT_GachaAdmin_v1.8.8.gs
          grep -q "GACHA_GRANT_EXECUTE='J25'" APPS_SCRIPT_GachaAdmin_v1.8.8.gs
          grep -q 'emuzii_ガチャ付与履歴' APPS_SCRIPT_GachaAdmin_v1.8.8.gs
          grep -q 'メンシプガチャは現在停止中です' APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs
          grep -q 'ラキフェスガチャは現在停止中です' APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs
          grep -q 'メンシプガチャ（停止中）' gacha-page.v1.8.8_PREP.js
          grep -q 'ラキフェス（停止中）' gacha-page.v1.8.8_PREP.js
          grep -q 'gachaAdminReady' APPS_SCRIPT_DeviceRecovery_v1.8.8.gs

      - name: Commit prepared files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            APPS_SCRIPT_Code_v1.8.8_NO_DUPLICATES.gs \
            APPS_SCRIPT_GachaAdmin_v1.8.8.gs \
            APPS_SCRIPT_DeviceRecovery_v1.8.8.gs \
            gacha-page.v1.8.8_PREP.js \
            V1.8.8_GACHA_NO_DUPLICATES_HANDOFF.md \
            V1.8.8_GACHA_ADMIN_PREP_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No prepared changes'
            exit 0
          fi
          git commit -m 'Prepare v1.8.8 gacha operations update'
          git push
