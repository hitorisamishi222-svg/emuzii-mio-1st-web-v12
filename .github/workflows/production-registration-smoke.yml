name: One-time production registration smoke test
on:
  push:
    branches:
      - test/production-registration-smoke-20261019
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/production-light-enrollment-smoke.mjs
