name: Gacha confirmed-history fallback browser (new only)

on:
  push:
    branches:
      - feature/mio-royal-gacha-deluxe-20261023
    paths:
      - 'tests/gacha-confirmed-history-fallback-browser.mjs'
      - '.github/workflows/gacha-confirmed-history-fallback-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-history-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use installed Chrome without fetching Playwright browser
        run: |
          google-chrome --version
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Run only eight NEW mocked history fallback cases
        env:
          MIO_SYSTEM_CHROME: '1'
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/gacha-history-fallback.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8767/gacha.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/gacha-confirmed-history-fallback-browser.mjs
