name: Remaining mobile browser checks
on:
  push:
    branches:
      - release/v2-next-integrated-replica
    paths:
      - '.github/workflows/remaining-browser-tests.yml'
      - 'release-prep/mobile-browser.integration.mjs'
permissions:
  contents: read
jobs:
  mobile-browser:
    if: github.ref == 'refs/heads/release/v2-next-integrated-replica'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      MIO_BROWSER: ${{ matrix.browser }}
      # Rerun failures and pages affected by the visual fix; reuse other baseline passes.
      MIO_BROWSER_CASES: '{"chromium":["320-home-portrait-next","320-news","320-schedule","320-home-updates-demo","320-integrated-live-demo","320-integrated-menu-navigation","375-home-portrait-next","375-news","375-schedule","375-home-updates-demo","375-integrated-live-demo","375-integrated-menu-navigation","390-home-portrait-next","390-news","390-schedule","390-home-updates-demo","390-integrated-live-demo","390-integrated-menu-navigation","430-home-portrait-next","430-news","430-schedule","430-home-updates-demo","430-integrated-live-demo","430-integrated-menu-navigation","safe-controls-next-preview","safe-controls-home-portrait-next","safe-controls-home-top-demo","safe-controls-home-updates-demo","safe-controls-news","safe-controls-schedule","safe-controls-attendance-deluxe-demo","safe-controls-mypage-deluxe-demo","safe-controls-admin-center-demo","safe-controls-community-demo","safe-controls-music-gallery-demo","safe-controls-login-recovery-demo","safe-controls-login-id-settings-preview","safe-controls-passkey-preview","safe-controls-integrated-live-demo","safe-controls-release-readiness","safe-controls-mobile-checklist"],"webkit":["320-home-portrait-next","320-news","320-schedule","320-home-updates-demo","320-integrated-live-demo","320-integrated-menu-navigation","375-home-portrait-next","375-news","375-schedule","375-home-updates-demo","375-integrated-live-demo","375-integrated-menu-navigation","390-home-portrait-next","390-news","390-schedule","390-home-updates-demo","390-integrated-live-demo","390-integrated-menu-navigation","430-home-portrait-next","430-news","430-schedule","430-home-updates-demo","430-integrated-live-demo","430-integrated-menu-navigation","safe-controls-next-preview","safe-controls-home-portrait-next","safe-controls-home-top-demo","safe-controls-home-updates-demo","safe-controls-news","safe-controls-schedule","safe-controls-attendance-deluxe-demo","safe-controls-mypage-deluxe-demo","safe-controls-admin-center-demo","safe-controls-community-demo","safe-controls-music-gallery-demo","safe-controls-login-recovery-demo","safe-controls-login-id-settings-preview","safe-controls-passkey-preview","safe-controls-integrated-live-demo","safe-controls-release-readiness","safe-controls-mobile-checklist"]}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime in temporary directory
        run: npm install --prefix "$RUNNER_TEMP/mio-browser" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.56.1
      - name: Install selected browser and system dependencies
        run: '"$RUNNER_TEMP/mio-browser/node_modules/.bin/playwright" install --with-deps "$MIO_BROWSER"'
      - name: Verify remaining pages at mobile viewport sizes with external traffic blocked
        env:
          MIO_BROWSER_MODULE: ${{ runner.temp }}/mio-browser/node_modules/playwright
        run: node --test release-prep/mobile-browser.integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-${{ matrix.browser }}
          path: artifacts/mobile-browser-${{ matrix.browser }}/
          retention-days: 7
