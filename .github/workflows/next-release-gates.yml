name: Next Integrated Release Gate
on:
  push:
    paths:
      - 'release-prep/**'
      - '.github/workflows/next-release-gates.yml'
  pull_request:
    paths:
      - 'release-prep/**'
      - '.github/workflows/next-release-gates.yml'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify manifest schema and block early production release
        run: node release-prep/verify-manifest.js
      - name: Test release safety checks
        run: node --test release-prep/verify-manifest.test.js
