name: v1.9.3 Browser Identity Regression
on:
  push:
    branches:
      - fix/v193-browser-auth-handoff-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run isolated, no-secret tests
        run: node --test release-prep/browser-identity-v193.test.mjs
