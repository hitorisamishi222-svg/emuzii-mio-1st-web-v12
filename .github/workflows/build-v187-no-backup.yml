name: Build v1.8.7 No Backup Release

on:
  push:
    paths:
      - '.github/workflows/build-v187-no-backup.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build no-backup Apps Script files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          core_path=Path('APPS_SCRIPT_Code_v1.8.7.gs')
          addon_path=Path('APPS_SCRIPT_DeviceRecovery_v1.8.7.gs')
          core=core_path.read_text(encoding='utf-8')
          addon=addon_path.read_text(encoding='utf-8')

          def find_function_span(src,name):
              m=re.search(r'(?m)^function\s+'+re.escape(name)+r'\s*\(',src)
              if not m:return None
              brace=src.find('{',m.end())
              if brace<0:raise SystemExit('Missing opening brace for '+name)
              i=brace+1; depth=1; quote=None; esc=False; line_comment=False; block_comment=False
              while i<len(src):
                  ch=src[i]; nxt=src[i+1] if i+1<len(src) else ''
                  if line_comment:
                      if ch=='\n': line_comment=False
                  elif block_comment:
                      if ch=='*' and nxt=='/': block_comment=False; i+=1
                  elif quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                  else:
                      if ch=='/' and nxt=='/': line_comment=True; i+=1
                      elif ch=='/' and nxt=='*': block_comment=True; i+=1
                      elif ch in ('\"',"'",'`'): quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              end=i+1
                              while end<len(src) and src[end] in ' \t': end+=1
                              if end<len(src) and src[end]=='\r': end+=1
                              if end<len(src) and src[end]=='\n': end+=1
                              return m.start(),end
                  i+=1
              raise SystemExit('Unclosed function '+name)

          def remove_functions(src,names):
              spans=[]
              for name in names:
                  sp=find_function_span(src,name)
                  if sp: spans.append(sp)
              for a,b in sorted(spans, reverse=True): src=src[:a]+src[b:]
              return src

          # Core: remove all secondary-save constants and functions.
          core=re.sub(r"(?m)^var SECONDARY_SHEET_ID = .*?;\n",'',core)
          core=re.sub(r"(?m)^var BACKUP_LOG_TAB = .*?;\n",'',core)
          core=re.sub(r"(?m)^var BACKUP_SWEEP_MINUTES = .*?;\n",'',core)
          core=re.sub(r"(?ms)^var BACKUP_MIRROR_TABS = \[.*?^\];\n",'',core)

          fn_names=re.findall(r'(?m)^function\s+([A-Za-z0-9_]+)\s*\(',core)
          remove_core=[n for n in fn_names if n.startswith('backup') or n in ('setupBackupV187_','verifyBackupV187_')]
          core=remove_functions(core,remove_core)
          core=re.sub(r'(?m)^\s*setupBackupV187_\(\);\s*\n','',core)
          core=re.sub(r'(?m)^\s*try\{backup[^\n]*?\}catch\(ignore\)\{\}\s*\n','',core)
          core=core.replace('翠央1周年 統合修正版 v1.8.7','翠央1周年 統合修正版 v1.8.7 NO-BACKUP')
          core=core.replace('Web参加者MIO-ID自動接続・端末復旧整合・皆勤2回制限・ラキフェス5回目制御・第二保存','Web参加者MIO-ID自動接続・端末復旧整合・皆勤2回制限・ラキフェス5回目制御')

          # Add-on: remove backup-based restore helpers and backup calls.
          addon=remove_functions(addon,['latestBackupStateForParticipant_','restoreCheckinAttemptsFromBackupV187_','restoreAllCheckinAttemptsFromBackupV187_'])
          addon=re.sub(r'(?m)^\s*try\{backup[^\n]*?\}catch\(ignore\)\{\}\s*\n','',addon)
          addon=addon.replace(' * 秘密鍵はバックアップシートへ保存しない。\n',' * 二重保存・第二保存にはアクセスしない。\n')

          setup_fn='''function setupWebRecoveryV187_(){\n  ScriptApp.getProjectTriggers().forEach(function(t){\n    var handler=t.getHandlerFunction();\n    if(handler==='webRecoveryOnEdit_'||handler==='backupSweep_')ScriptApp.deleteTrigger(t);\n  });\n  ScriptApp.newTrigger('webRecoveryOnEdit_').forSpreadsheet(SHEET_ID).onEdit().create();\n}\n'''
          sp=find_function_span(addon,'setupWebRecoveryV187_')
          if not sp: raise SystemExit('setupWebRecoveryV187_ not found')
          addon=addon[:sp[0]]+setup_fn+addon[sp[1]:]

          verify_fn='''function verifyV187Ready_(){\n  var ss=SpreadsheetApp.openById(SHEET_ID),web=ss.getSheetByName(WEB_TAB);\n  var webRows=web?webActualRows_(web):[];\n  var badWeb=[];\n  webRows.forEach(function(r){\n    if(r[5]==='承認済み'&&!webIntegrityOk_(r))badWeb.push({webId:String(r[0]||''),name:String(r[2]||''),h:String(r[7]||''),k:String(r[10]||''),p:String(r[15]||''),confirm:String(r[11]||'')});\n  });\n\n  var normal=catalog_(ss,'通常'),fest=catalog_(ss,'ラキフェス');\n  var triggerNames=ScriptApp.getProjectTriggers().map(function(t){return t.getHandlerFunction()});\n  var recoveryCount=triggerNames.filter(function(x){return x==='webRecoveryOnEdit_'}).length;\n  var backupCount=triggerNames.filter(function(x){return x==='backupSweep_'}).length;\n\n  return {\n    ok:badWeb.length===0&&normal.ready&&fest.ready&&recoveryCount===1&&backupCount===0,\n    webActualCount:web?webActualCount_(web):0,\n    webIntegrityIssues:badWeb,\n    normalReady:normal.ready,\n    normalProbability:normal.total,\n    luckyFestivalReady:fest.ready,\n    luckyFestivalProbability:fest.total,\n    secondSaveEnabled:false,\n    webRecoveryTriggerCount:recoveryCount,\n    backupTriggerCount:backupCount,\n    triggers:triggerNames\n  };\n}\n'''
          sp=find_function_span(addon,'verifyV187Ready_')
          if not sp: raise SystemExit('verifyV187Ready_ not found')
          addon=addon[:sp[0]]+verify_fn+addon[sp[1]:]

          banned=['SECONDARY_SHEET_ID','BACKUP_LOG_TAB','BACKUP_SWEEP_MINUTES','BACKUP_MIRROR_TABS','setupBackupV187_','verifyBackupV187_','backupAfter','backupMirror','backupAppend_','backupRefresh','latestBackupStateForParticipant_','restoreCheckinAttemptsFromBackupV187_','restoreAllCheckinAttemptsFromBackupV187_']
          joined=core+'\n'+addon
          bad=[x for x in banned if x in joined]
          if bad: raise SystemExit('Backup dependency remains: '+','.join(bad))

          Path('APPS_SCRIPT_Code_v1.8.7_NO_BACKUP.gs').write_text(core,encoding='utf-8')
          Path('APPS_SCRIPT_DeviceRecovery_v1.8.7_NO_BACKUP.gs').write_text(addon,encoding='utf-8')

          checklist='''# v1.8.7 NO-BACKUP Release Checklist\n\n## 方針\n- 本番v1.8.6を土台に、二重保存以外のv1.8.7改善のみ適用する。\n- 第二保存スプレッドシートは削除しないが、この版からは一切アクセスしない。\n- 新しいApps Scriptプロジェクト／Vercelプロジェクト／GitHub repo／Web App deploymentは作らない。\n\n## 本番用ファイル\n1. APPS_SCRIPT_Code_v1.8.7_NO_BACKUP.gs\n2. APPS_SCRIPT_DeviceRecovery_v1.8.7_NO_BACKUP.gs\n\n旧v1.8.7のBackupModule/WebIntegrityや第二保存コードは本番へ入れない。\n\n## 残す改善\n- Web登録の実データ行判定（数式の空行でgetLastRowが膨らむ問題を回避）\n- 新端末承認時のMIO-ID復旧・旧端末整理\n- MIO-0004 / 翠央(お試し) の自動却下禁止\n- H/K/P/L整合チェック\n- 皆勤確認文字2回制限\n- ガチャ 1か月=1 / 3か月=3 / 6か月=5\n- 5回目からラキフェス選択\n\n## 二重保存の扱い\n- SECONDARY_SHEET_IDなし\n- backupSweep_関数なし\n- 第二保存同期関数なし\n- 第二保存からの復旧関数なし\n- setup時に残存backupSweep_トリガーがあれば削除\n- 第二保存ファイル自体は削除しない\n\n## 適用\n1. Workで既存Apps Script「emuzii 翠央1周年 Web連携 v1.2」を開く。\n2. v1.8.6をロールバック用に維持。\n3. 上記NO_BACKUP 2ファイルだけを反映。\n4. setupV187Complete()を1回実行。\n5. verifyV187Ready_()を実行。\n6. 必須条件:\n   - ok:true\n   - webIntegrityIssues:[]\n   - normalReady:true / normalProbability:100\n   - luckyFestivalReady:true / luckyFestivalProbability:100\n   - secondSaveEnabled:false\n   - webRecoveryTriggerCount:1\n   - backupTriggerCount:0\n7. MIO-0003 = 総6 / 使用2 / 残4 を確認。\n8. MIO-0004 = 承認済み・使用中・10/5,10/6皆勤を確認。\n9. 同じ既存deployment IDでのみ更新。\n10. 本番確認後にのみ index.html / gacha.html の表示をv1.8.7へ変更。\n\n## エラー時\n- 即v1.8.6へ戻す。\n- 同じdeployment IDを維持。\n- 参加者・当選履歴・皆勤データを削除しない。\n'''
          Path('V1.8.7_NO_BACKUP_RELEASE_CHECKLIST.md').write_text(checklist,encoding='utf-8')
          PY

      - name: Syntax and dependency checks
        shell: bash
        run: |
          set -euo pipefail
          for f in APPS_SCRIPT_Code_v1.8.7_NO_BACKUP.gs APPS_SCRIPT_DeviceRecovery_v1.8.7_NO_BACKUP.gs; do
            cp "$f" "/tmp/$(basename "$f" .gs).js"
            node --check "/tmp/$(basename "$f" .gs).js"
          done
          ! grep -R -E 'SECONDARY_SHEET_ID|setupBackupV187_|verifyBackupV187_|backupAfter|backupMirror|backupAppend_|latestBackupStateForParticipant_' APPS_SCRIPT_*_v1.8.7_NO_BACKUP.gs

      - name: Commit release files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add APPS_SCRIPT_Code_v1.8.7_NO_BACKUP.gs APPS_SCRIPT_DeviceRecovery_v1.8.7_NO_BACKUP.gs V1.8.7_NO_BACKUP_RELEASE_CHECKLIST.md
          git commit -m 'Prepare v1.8.7 no-backup release'
          git push
