name: Gacha Face ID passkey checks
on:
  push:
    branches:
      - feature/mio-gacha-faceid-passkey-20261030
  pull_request:
    paths:
      - api-gacha-passkey.js
      - gacha-passkey-auth.js
      - gacha-passkey-ui.js
      - gacha-web-gate.html
      - api-gacha-web-gate.js
      - sql/gacha-admin-passkey-isolated.sql
      - tests/mio-gacha-faceid-passkey.test.mjs
      - vercel.json
      - .github/workflows/gacha-faceid-passkey.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check api-gacha-passkey.js
      - run: node --check gacha-passkey-auth.js
      - run: node --check gacha-passkey-ui.js
      - run: node --check api-gacha-web-gate.js
      - run: node --test tests/mio-gacha-faceid-passkey.test.mjs
      - name: Check deployed Face ID readiness without login credentials
        run: |
          node --input-type=module - <<'NODE'
          const origin='https://emuzii-mio-1st-web-v12.vercel.app';
          const response=await fetch(origin+'/api/gacha-passkey',{
            method:'POST',
            headers:{Origin:origin,'Content-Type':'application/json'},
            body:JSON.stringify({action:'status'}),
            signal:AbortSignal.timeout(15000)
          });
          const result=await response.json().catch(()=>({}));
          console.log('Production passkey readiness:',response.status,'ok:',result.ok===true,'authenticated:',result.authenticated===true);
          if(response.status!==200||result.ok!==true||result.authenticated!==false)
            process.exitCode=1;
          NODE
