name: MIO large update copy baseline audit (no release)

on:
  push:
    branches:
      - release/v2-next-integrated-replica
    paths:
      - release-prep/replica-baseline-audit.mjs
      - release-prep/INTEGRATION_BRIDGE_20261101.md
      - .github/workflows/mio-replica-baseline-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-copy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch latest main for read-only comparison
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Audit copy against latest protected production code
        run: node release-prep/replica-baseline-audit.mjs --expect-copy-blocked
      - name: Build approved static copy without API or GAS connection
        run: |
          bash ./build-preview.sh
          for page in home-portrait-next.html attendance-deluxe-demo.html mypage-deluxe-demo.html community-demo.html music-gallery-demo.html admin-center-demo.html; do
            test -s "public/$page"
          done
          test ! -e public/api-gacha.js
          test ! -e public/api-register.js
          test ! -e public/gacha.html
          test ! -e public/index.html
          test ! -e public/bridge.js
      - name: Verify copy-only test artifacts cannot write to production
        run: |
          test -f release-prep/REPLICA_WORKPLAN.md
          test -f release-prep/replica-safety.test.mjs
          test -f vercel.json
          test -f build-preview.sh
          node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('vercel.json','utf8'));if(c.buildCommand!=='bash ./build-preview.sh'||c.outputDirectory!=='public'||c.rewrites?.some(x=>x.source.startsWith('/api/')))process.exit(1);"
          grep -Fq "! -name 'api-*.js'" build-preview.sh
          grep -Fq "test ! -e public/bridge.js" build-preview.sh
          git diff --exit-code
      # No Vercel deploy, main merge, GAS, Neon, Sheets or draw execution here.
