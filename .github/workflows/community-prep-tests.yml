name: Community Prep Tests
on:
  push:
    paths:
      - 'community-policy.js'
      - 'community-policy.test.js'
      - '.github/workflows/community-prep-tests.yml'
  pull_request:
    paths:
      - 'community-policy.js'
      - 'community-policy.test.js'
      - '.github/workflows/community-prep-tests.yml'
permissions:
  contents: read
jobs:
  community-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check community-policy.js
      - run: node --test community-policy.test.js
