name: V2 gacha and authorization tests
on:
  push:
    branches:
      - release/v2-next-integrated-replica
    paths:
      - 'v2-*.mjs'
      - '.github/workflows/v2-tests.yml'
  workflow_dispatch:
jobs:
  test:
    if: github.ref == 'refs/heads/release/v2-next-integrated-replica'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated V2 regression tests
        run: node --test v2-*.test.mjs
