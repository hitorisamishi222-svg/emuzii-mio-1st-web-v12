name: Participant registration review
on:
  push:
    branches: [fix/participant-registration-recovery-review]
  workflow_dispatch:
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/participant-registration-recovery.test.mjs
