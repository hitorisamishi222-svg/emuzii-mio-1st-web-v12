name: Gacha generated legacy candidate smoke (new only)

on:
  push:
    branches:
      - feature/mio-royal-gacha-deluxe-20261023
    paths:
      - 'tests/gacha-legacy-generated-candidate-smoke.test.mjs'
      - '.github/workflows/gacha-legacy-generated-candidate-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-candidate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load isolated gacha tests and candidate generator
        uses: actions/checkout@v4
        with:
          path: gacha-ui
          persist-credentials: false
      - name: Load known legacy GitHub main reference (NOT deployed GAS)
        uses: actions/checkout@v4
        with:
          ref: a701935c72c8f2fd37dd798c269c28376081494e
          path: legacy-main
          persist-credentials: false
      - name: Load staged GAS logic (NOT deployed GAS)
        uses: actions/checkout@v4
        with:
          ref: 390f167655616fc6e8331bc4a16b40f007fe96f7
          path: gacha-core
          persist-credentials: false
      - name: Execute ONLY new generated candidate smoke tests
        env:
          MIO_MAIN_CODE_PATH: ${{ github.workspace }}/legacy-main/Code.gs
          MIO_GACHA_CORE_PATH: ${{ github.workspace }}/gacha-core/Code.gs
        run: |
          node --version
          node --test gacha-ui/tests/gacha-legacy-generated-candidate-smoke.test.mjs
