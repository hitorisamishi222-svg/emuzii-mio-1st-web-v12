name: Remaining browser login cookie and device-session tests
on:
  push:
    branches:
      - release/v2-next-integrated-replica
    paths:
      - '.github/workflows/remaining-auth-browser-tests.yml'
      - 'release-prep/auth-browser.integration.mjs'
      - 'release-prep/test-auth-http-server.mjs'
      - 'security/mio-passkey-service.mjs'
      - 'security/mio-test-http-router.mjs'
      - 'security/mio-passkey-schema.preview.sql'
      - 'passkey-preview.html'
      - 'login-recovery-demo.html'
      - 'device-sessions-preview.html'
permissions:
  contents: read
jobs:
  browser-auth:
    if: github.ref == 'refs/heads/release/v2-next-integrated-replica'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      MIO_BROWSER: ${{ matrix.browser }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mio_test
          POSTGRES_PASSWORD: mio_ci_only
          POSTGRES_DB: mio_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mio_test -d mio_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser and database drivers into temporary CI directory
        run: npm install --prefix "$RUNNER_TEMP/mio-auth-browser" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.61.0 pg@8.16.3
      - name: Install pinned WebAuthn server library in repository module resolution path
        run: npm install --ignore-scripts --no-audit --no-fund --no-save --no-package-lock @simplewebauthn/server@13.2.2
      - name: Install selected browser and system dependencies
        run: '"$RUNNER_TEMP/mio-auth-browser/node_modules/.bin/playwright" install --with-deps "$MIO_BROWSER"'
      - name: Create short lived CI-only localhost TLS certificate
        run: openssl req -x509 -nodes -newkey rsa:2048 -keyout "$RUNNER_TEMP/mio-auth-test.key" -out "$RUNNER_TEMP/mio-auth-test.crt" -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost'
      - name: Test real UI, browser cookie jar, API and isolated PostgreSQL
        env:
          MIO_TEST_DATABASE_URL: postgresql://mio_test:mio_ci_only@127.0.0.1:5432/mio_ci_test
          MIO_TEST_PG_MODULE: ${{ runner.temp }}/mio-auth-browser/node_modules/pg
          MIO_BROWSER_MODULE: ${{ runner.temp }}/mio-auth-browser/node_modules/playwright
          MIO_TEST_WEBAUTHN_MODULE: ${{ github.workspace }}/node_modules/@simplewebauthn/server
          MIO_TEST_TLS_KEY: ${{ runner.temp }}/mio-auth-test.key
          MIO_TEST_TLS_CERT: ${{ runner.temp }}/mio-auth-test.crt
        run: node --test release-prep/auth-browser.integration.mjs
