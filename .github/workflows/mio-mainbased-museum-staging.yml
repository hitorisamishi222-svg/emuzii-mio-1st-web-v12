name: MIO v2 main-based museum staging safety (no production release)

on:
  push:
    branches:
      - feature/mio-v2-integration-mainbaseline-20261102
    paths:
      - museum*
      - mio-profile.html
      - vercel.json
      - tests/mio-mainbased-museum-integration.test.mjs
      - tests/mio-gas-safe-onboarding.test.mjs
      - docs/MIO_GAS_SAFE_EXISTING_DEPLOYMENT_20261102.md
      - gacha-web-gate.html
      - tests/browser-registration-status.test.mjs
      - tests/gacha-legacy-recovery.test.mjs
      - tests/mio-mg-admin-browser-approved-recovery.test.mjs
      - tests/gacha-release-visual-scope.test.mjs
      - .github/workflows/mio-mainbased-museum-staging.yml
  pull_request:
    branches:
      - main
    paths:
      - museum*
      - mio-profile.html
      - vercel.json
      - tests/mio-mainbased-museum-integration.test.mjs
      - tests/mio-gas-safe-onboarding.test.mjs
      - docs/MIO_GAS_SAFE_EXISTING_DEPLOYMENT_20261102.md
      - gacha-web-gate.html
      - tests/browser-registration-status.test.mjs
      - tests/gacha-legacy-recovery.test.mjs
      - tests/mio-mg-admin-browser-approved-recovery.test.mjs
      - tests/gacha-release-visual-scope.test.mjs
      - .github/workflows/mio-mainbased-museum-staging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  museum-staging-only:
    name: Main baseline parity + museum and media safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out current staging branch, no credentials retained
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current production source tree without altering it
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Syntax check only new museum presentation code
        run: |
          node --check museum-archive.js
          node --check museum-news.js
          node --check museum-approved-gallery.js
          node --check museum-media-fallback.js
          node --check tests/mio-mainbased-museum-integration.test.mjs
      - name: Verify all original login, check-in, gacha and gallery files remain identical to main
        run: node --test tests/mio-mainbased-museum-integration.test.mjs
      - name: Previously failing registration status mock only (no live requests)
        run: node --test tests/browser-registration-status.test.mjs
      - name: Previously failing same-drawId recovery mock only (no draw requests)
        run: node --test tests/gacha-legacy-recovery.test.mjs
      - name: Install existing test imports without executing package scripts
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Unapproved browser must stay blocked (failed-only case)
        run: node --test --test-name-pattern='other unapproved browsers' tests/mio-mg-admin-browser-approved-recovery.test.mjs
      - name: Existing cache-busted gacha asset is still loaded (failed-only case)
        run: node --test --test-name-pattern='luxury v2.1 is loaded' tests/gacha-release-visual-scope.test.mjs
      - name: Existing GAS safe onboarding and disabled management controls
        run: node --test tests/mio-gas-safe-onboarding.test.mjs
      - name: Confirm this test did not modify tracked files
        run: git diff --exit-code
      # No GAS, DB, Blob, real lottery, Vercel production promotion or PR merge.
