name: Synthetic negative-path browser auth checks
on:
  push:
    branches:
      - release/v2-next-integrated-replica
    paths:
      - '.github/workflows/synthetic-negative-auth-browser.yml'
      - 'release-prep/auth-negative-browser.integration.mjs'
permissions:
  contents: read
jobs:
  synthetic-negative-auth:
    if: github.ref == 'refs/heads/release/v2-next-integrated-replica'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      MIO_BROWSER: ${{ matrix.browser }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mio_test
          POSTGRES_PASSWORD: mio_ci_only
          POSTGRES_DB: mio_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mio_test -d mio_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser and database drivers into temporary CI directory
        run: npm install --prefix "$RUNNER_TEMP/mio-auth-negative" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.56.1 pg@8.16.3
      - name: Install selected browser and system dependencies
        run: '"$RUNNER_TEMP/mio-auth-negative/node_modules/.bin/playwright" install --with-deps "$MIO_BROWSER"'
      - name: Create short lived CI-only localhost TLS certificate
        run: openssl req -x509 -nodes -newkey rsa:2048 -keyout "$RUNNER_TEMP/mio-auth-negative.key" -out "$RUNNER_TEMP/mio-auth-negative.crt" -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost'
      - name: Test synthetic invalid credentials in actual browser UI and isolated PostgreSQL
        env:
          CI: 'true'
          MIO_TEST_DATABASE_URL: postgresql://mio_test:mio_ci_only@127.0.0.1:5432/mio_ci_test
          MIO_TEST_PG_MODULE: ${{ runner.temp }}/mio-auth-negative/node_modules/pg
          MIO_BROWSER_MODULE: ${{ runner.temp }}/mio-auth-negative/node_modules/playwright
          MIO_TEST_TLS_KEY: ${{ runner.temp }}/mio-auth-negative.key
          MIO_TEST_TLS_CERT: ${{ runner.temp }}/mio-auth-negative.crt
        run: node --test release-prep/auth-negative-browser.integration.mjs
