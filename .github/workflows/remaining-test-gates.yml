name: Remaining auth and isolated PostgreSQL tests
on:
  push:
    branches:
      - release/v2-next-integrated-replica
    paths:
      - '.github/workflows/remaining-test-gates.yml'
      - 'release-prep/postgres-live.integration.mjs'
permissions:
  contents: read
jobs:
  remaining-auth-tests:
    if: github.ref == 'refs/heads/release/v2-next-integrated-replica'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run auth tests missing from earlier CI coverage
        run: node --test --test-skip-pattern='^rejects malformed device session ID without revoking active sessions$' security/*.test.mjs
  isolated-postgres-tests:
    if: github.ref == 'refs/heads/release/v2-next-integrated-replica'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mio_test
          POSTGRES_PASSWORD: mio_ci_only
          POSTGRES_DB: mio_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mio_test -d mio_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned database driver into temporary CI directory
        run: npm install --prefix "$RUNNER_TEMP/mio-pg-driver" --ignore-scripts --no-audit --no-fund --save-exact pg@8.16.3
      - name: Verify migrations and account transactions against real isolated PostgreSQL
        env:
          MIO_TEST_DATABASE_URL: postgresql://mio_test:mio_ci_only@127.0.0.1:5432/mio_ci_test
          MIO_TEST_PG_MODULE: ${{ runner.temp }}/mio-pg-driver/node_modules/pg
        run: node --test release-prep/postgres-live.integration.mjs
