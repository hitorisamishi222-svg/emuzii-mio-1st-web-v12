name: Mio participant verification staging tests
on:
  push:
    branches:
      - feature/mio-ip-five-history-20261021
    paths:
      - participant-device-store-v204.js
      - tests/participant-device-store-v204.test.mjs
      - participant-passkey-core-v204.js
      - tests/participant-passkey-core-v204.test.mjs
      - registration-ip-history-v203.js
      - participant-verified-operation-v205.js
      - tests/participant-verified-operation-v205.test.mjs
      - tests/ip-history-v203.test.mjs
      - .github/workflows/mio-v204-verified-browser-tests.yml
  pull_request:
    paths:
      - participant-device-store-v204.js
      - tests/participant-device-store-v204.test.mjs
      - participant-passkey-core-v204.js
      - tests/participant-passkey-core-v204.test.mjs
      - registration-ip-history-v203.js
      - tests/ip-history-v203.test.mjs
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check participant-device-store-v204.js
      - run: node --check participant-verified-operation-v205.js
      - run: node --check participant-passkey-core-v204.js
      - run: node --check registration-ip-history-v203.js
      - run: node --test tests/participant-device-store-v204.test.mjs tests/participant-passkey-core-v204.test.mjs tests/participant-verified-operation-v205.test.mjs tests/ip-history-v203.test.mjs
