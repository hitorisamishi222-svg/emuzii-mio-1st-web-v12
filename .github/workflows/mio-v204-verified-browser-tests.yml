name: Mio participant verification staging tests
on:
  push:
    branches:
      - feature/mio-ip-five-history-20261021
    paths:
      - gas/mio-identity-attestation-v218.gs
      - tests/mio-gas-identity-attestation-v218.test.mjs
      - participant-device-store-v204.js
      - tests/participant-device-store-v204.test.mjs
      - participant-passkey-core-v204.js
      - tests/participant-passkey-core-v204.test.mjs
      - registration-ip-history-v203.js
      - tests/participant-postgres-integration-v207.test.mjs
      - participant-webauthn-server-v208.js
      - tests/participant-real-webauthn-v208.test.mjs
      - tests/participant-real-registration-v217.test.mjs
      - tests/helpers/participant-registration-fixture-v217.mjs
      - db/mio-participant-passkeys-v204.sql
      - db/mio-browser-links-v204.sql
      - db/mio-verified-operation-grants-v205.sql
      - participant-verified-operation-v205.js
      - participant-passkey-registration-server-v211.js
      - tests/participant-passkey-registration-server-v211.test.mjs
      - participant-registration-continuity-v214.js
      - participant-passkey-registration-continuous-v215.js
      - participant-gas-passkey-continuous-v216.js
      - db/mio-passkey-bootstrap-continuity-v215.sql
      - participant-gas-passkey-entry-v213.js
      - tests/participant-gas-passkey-entry-v213.test.mjs
      - participant-gas-identity-preflight-v212.js
      - tests/participant-gas-identity-preflight-v212.test.mjs
      - participant-bootstrap-guard-v210.js
      - tests/participant-bootstrap-guard-v210.test.mjs
      - participant-passkey-device-orchestrator-v206.js
      - tests/participant-passkey-device-orchestrator-v206.test.mjs
      - tests/participant-verified-operation-v205.test.mjs
      - tests/ip-history-v203.test.mjs
      - .github/workflows/mio-v204-verified-browser-tests.yml
  pull_request:
    paths:
      - participant-device-store-v204.js
      - tests/participant-device-store-v204.test.mjs
      - participant-passkey-core-v204.js
      - tests/participant-passkey-core-v204.test.mjs
      - registration-ip-history-v203.js
      - tests/participant-postgres-integration-v207.test.mjs
      - participant-webauthn-server-v208.js
      - tests/participant-real-webauthn-v208.test.mjs
      - tests/participant-real-registration-v217.test.mjs
      - tests/helpers/participant-registration-fixture-v217.mjs
      - db/mio-participant-passkeys-v204.sql
      - db/mio-browser-links-v204.sql
      - db/mio-verified-operation-grants-v205.sql
      - tests/ip-history-v203.test.mjs
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock
      - run: node --test tests/mio-gas-identity-attestation-v218.test.mjs
      - run: node --check participant-device-store-v204.js
      - run: node --check participant-passkey-registration-server-v211.js
      - run: node --check participant-bootstrap-guard-v210.js
      - run: node --check participant-gas-identity-preflight-v212.js
      - run: node --check participant-registration-continuity-v214.js
      - run: node --check participant-passkey-registration-continuous-v215.js
      - run: node --check participant-gas-passkey-continuous-v216.js
      - run: node --check participant-gas-passkey-entry-v213.js
      - run: node --check participant-passkey-device-orchestrator-v206.js
      - run: node --check participant-verified-operation-v205.js
      - run: node --check participant-passkey-core-v204.js
      - run: node --check registration-ip-history-v203.js
      - run: node --test tests/participant-device-store-v204.test.mjs tests/participant-passkey-core-v204.test.mjs tests/participant-verified-operation-v205.test.mjs tests/participant-passkey-device-orchestrator-v206.test.mjs tests/participant-bootstrap-guard-v210.test.mjs tests/participant-passkey-registration-server-v211.test.mjs tests/participant-gas-identity-preflight-v212.test.mjs tests/participant-gas-passkey-entry-v213.test.mjs tests/ip-history-v203.test.mjs
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mio_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: mio_staging_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mio_ci -d mio_staging_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGTEST_URL: postgresql://mio_ci:ephemeral_ci_only@127.0.0.1:5432/mio_staging_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock
      - run: node --check tests/participant-postgres-integration-v207.test.mjs
      - run: node --check tests/participant-real-webauthn-v208.test.mjs
      - run: node --test tests/participant-real-webauthn-v208.test.mjs
      - run: node --check tests/participant-real-registration-v217.test.mjs
      - run: node --test tests/participant-real-registration-v217.test.mjs
      - run: node --test tests/participant-postgres-integration-v207.test.mjs
