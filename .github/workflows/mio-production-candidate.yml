name: MIO Production Candidate Safety
on:
  push:
    branches:
      - 'release/mio-production-candidate-20261016'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-candidate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real-data route wiring and read-only pending pages
        run: node --test release-prep/production-candidate-safety.test.mjs release-prep/identity-safe-v197.test.mjs
      - name: Cross-test v1.9.7 core with historical v1.8.9 device switch functions
        run: node release-prep/test-v197-device-switch-compat.cjs
      - name: Check retired browser fails closed in v1.9.7 switch candidate
        run: node release-prep/test-v197-device-switch-safety.cjs
