name: Gacha safe GAS single-function preflight (new only)

on:
  push:
    branches:
      - feature/mio-royal-gacha-deluxe-20261023
    paths:
      - 'tools/gacha-gas-dedup-preflight.mjs'
      - 'tests/gacha-gas-preflight.test.mjs'
      - '.github/workflows/gacha-gas-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout gacha-only code
        uses: actions/checkout@v4
        with:
          path: gacha-ui
          persist-credentials: false
      - name: Checkout non-production staged reference
        uses: actions/checkout@v4
        with:
          ref: release/v2-next-integrated-replica
          path: gacha-core
          persist-credentials: false
      - name: Check only new source-preserving preflight cases
        env:
          MIO_GACHA_CORE_PATH: ${{ github.workspace }}/gacha-core/Code.gs
        run: |
          node --version
          node --test gacha-ui/tests/gacha-gas-preflight.test.mjs
