<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>みお登録 v2｜隔離テスト</title>
<style>body{margin:0;background:#091a34;color:#f7f8ff;font:16px/1.7 system-ui,sans-serif}main{max-width:560px;margin:28px auto;padding:20px}.panel{background:#173456;border:1px solid #456184;border-radius:18px;padding:22px}h1{font-size:25px}label{display:block;margin:20px 0 6px}input{box-sizing:border-box;width:100%;padding:15px;border-radius:8px;border:2px solid #8ba8cc;font-size:16px;background:white;color:#111}button{width:100%;margin-top:20px;padding:16px;border:0;border-radius:10px;background:#ebc779;color:#152b46;font-size:17px;font-weight:700}button[disabled]{opacity:.6}#status{white-space:pre-wrap;margin-top:18px;padding:14px;border-radius:8px;background:#092445}small{color:#d2dced}</style></head>
<body><main><h1>翠央1周年 登録v2（開発テスト専用）</h1><p>この画面は本番とは切り離された試験環境です。実際のColorSing名・ログインIDは入力しないでください。</p>
<div class="panel"><form id="form"><label for="name">テスト用の名前</label><input id="name" maxlength="40" required placeholder="例：V2_TEST_SAMPLE" autocomplete="off"><label for="loginId">ログインID（今回は空欄）</label><input id="loginId" maxlength="32" autocomplete="off"><button id="submit" type="submit">テスト登録を保存</button></form><button id="refresh" type="button">保存状態を再確認</button><div id="status" role="status" aria-live="polite">待機中</div></div>
<p><small>登録後は運営による本人確認まで「承認待ち」。実際の参加者データ、皆勤、ガチャは更新されません。</small></p></main>
<script type="module">
const $=id=>document.getElementById(id);
const retryKey='mio-v2-preview-pending';
function pending(name,loginId){
 const raw=localStorage.getItem(retryKey);
 if(raw){const p=JSON.parse(raw);if(p.name!==name||p.loginId!==loginId)throw Error('以前の試験送信内容を再確認してください');return p}
 const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);
 const p={name,loginId,retryKey:Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join(''),retryIssuedAt:Date.now()};
 localStorage.setItem(retryKey,JSON.stringify(p));return p;
}
async function send(action,payload={}){
 const response=await fetch('/api/registration-v2',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...payload}),cache:'no-store'});
 const data=await response.json();if(!response.ok)throw Error(data.error||'HTTP '+response.status);return data;
}
$('form').addEventListener('submit',async event=>{
 event.preventDefault();$('submit').disabled=true;$('status').textContent='保存中…';
 try{
  const name=$('name').value.trim(),loginId=$('loginId').value.trim(),p=pending(name,loginId);
  const data=await send('register',p);
  localStorage.removeItem(retryKey);
  $('status').textContent='登録成功：'+data.participantId+'\n状態：'+data.status;
 }catch(error){$('status').textContent='保存を確認できません：'+error.message+'\n通信が不明な場合は同じ情報で再送してください';}
 finally{$('submit').disabled=false}
});
$('refresh').addEventListener('click',async()=>{
 try{const data=await send('status');$('status').textContent='保存状態：'+data.status+'\nブラウザID：'+data.participantId;}
 catch(error){$('status').textContent='確認できません：'+error.message}
});
</script></body></html>
