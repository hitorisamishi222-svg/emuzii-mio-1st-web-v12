<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ギャラリー登録｜管理者準備画面</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#05142d,#103c70);color:#eef8ff;font:16px/1.6 system-ui,-apple-system,sans-serif}.wrap{max-width:680px;margin:auto;padding:24px 16px}h1{font-size:23px}.note{border:1px solid #8bcaff8a;background:#112c50;border-radius:14px;padding:14px;margin:15px 0}label{display:block;margin:18px 0 5px;font-weight:700}input{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid #8bcaff;background:#061c3c;color:white}input[type=file]{font-size:13px}.preview{width:min(100%,330px);border:1px solid #8bcaff;border-radius:18px;overflow:hidden;margin:24px auto;background:#0d2d53;display:flex;flex-direction:column}.cover{aspect-ratio:4/5;background:#092347;display:flex;align-items:center;justify-content:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:contain}.details{padding:16px;min-height:190px;display:flex;flex-direction:column}.details p{overflow-wrap:anywhere}.action{display:block;text-align:center;border:1px solid #8bcaff;border-radius:12px;padding:12px;background:#164d84;color:white;text-decoration:none;margin-top:auto;pointer-events:none} .action.ready{pointer-events:auto;background:#17629c} .validation{color:#ffd6a1;font-size:13px;min-height:1.5em}button{width:100%;padding:13px;background:#33506a;color:#eee;border:1px solid #8bcaff;border-radius:12px;font:inherit}small{color:#b7d9fa}</style></head><body><main class="wrap"><h1>💙 ギャラリー作品登録</h1><div class="note">🔒 管理者認証・端末承認・画像保存先を準備中です。現在はプレビュー専用で、作品を公開・保存することはできません。</div><label for="pic">サムネイル画像</label><input id="pic" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>縦長・横長・正方形の画像を枠内に縮小して表示します。</small><label for="url">作品リンク（https://）</label><input id="url" type="url" inputmode="url" placeholder="https://vt.tiktok.com/..." maxlength="2048"><label for="title">作品タイトル</label><input id="title" maxlength="120" placeholder="作品タイトルを入力"><label for="category">作品カテゴリ</label><select id="category" style="width:100%;padding:12px;border-radius:12px;background:#061c3c;color:#fff;border:1px solid #8bcaff"><option>動画</option><option>イラスト</option><option>音声・楽曲</option><option>ファンアート</option><option>その他</option></select><label for="creator">投稿者名</label><input id="creator" maxlength="80" placeholder="えむじー🐱"><p id="validation" class="validation" role="status"></p><label for="fit">画像の表示方法</label><select id="fit" style="width:100%;padding:12px;border-radius:12px;background:#061c3c;color:#fff;border:1px solid #8bcaff"><option value="contain">全体を収める（余白あり）</option><option value="cover">枠いっぱいに表示（端を切り抜く）</option></select><button id="copyDraft" type="button" style="background:#17629c;margin-top:16px">作品情報をコピー</button><button id="saveDraft" type="button" style="background:#17629c;margin-top:16px">入力内容をこの端末に一時保存</button><button id="clearDraft" type="button" style="margin-top:8px">一時保存を削除</button><p class="validation">一時保存はタイトル・カテゴリ・投稿者名・リンクのみ。画像は保存されません。共有端末では使用しないでください。</p><h2>掲載プレビュー</h2><article class="preview"><div class="cover" id="cover"><span>画像を選択してください</span></div><div class="details"><small id="categoryPreview">動画</small><strong id="titlePreview">作品タイトル</strong><p id="name">投稿者名</p><a class="action" id="workLink" aria-disabled="true">作品を見る ↗</a></div></article><button id="download" type="button" style="background:#17629c" disabled>サムネイルをWebPで保存</button><p id="downloadInfo" class="validation">画像を選択すると保存できます。保存はスマホ内のみで、サイトには公開されません。</p><button id="publish" type="button" disabled>🔒 管理者認証の準備中（公開不可）</button><p id="publishStatus" class="validation" role="status">管理者承認・端末承認が完了するまで公開できません。</p><p><a style="color:#a7dfff" href="/gallery.html">← ギャラリーに戻る</a></p></main><script>
const pic=document.getElementById('pic'),cover=document.getElementById('cover'),name=document.getElementById('name'),creator=document.getElementById('creator'),url=document.getElementById('url'),workLink=document.getElementById('workLink'),validation=document.getElementById('validation');let objectUrl=null;const fit=document.getElementById('fit'),download=document.getElementById('download'),downloadInfo=document.getElementById('downloadInfo');fit.addEventListener('change',()=>{const img=cover.querySelector('img');if(img)img.style.objectFit=fit.value});const titleInput=document.getElementById('title'),categoryInput=document.getElementById('category');function refresh(){name.textContent=creator.value.trim()||'投稿者名';document.getElementById('titlePreview').textContent=titleInput.value.trim()||'作品タイトル';document.getElementById('categoryPreview').textContent=categoryInput.value;const value=url.value.trim();try{const u=new URL(value);if(u.protocol!=='https:')throw Error();workLink.href=u.href;workLink.target='_blank';workLink.rel='noopener noreferrer';workLink.classList.add('ready');workLink.removeAttribute('aria-disabled');validation.textContent='※プレビュー内のリンクは確認できます。作品の公開・保存はされません。'}catch{workLink.removeAttribute('href');workLink.classList.remove('ready');workLink.setAttribute('aria-disabled','true');validation.textContent=value?'作品リンクは https:// から入力してください。':''}}url.addEventListener('input',refresh);
pic.addEventListener('change',()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=null;cover.replaceChildren();download.disabled=true;const f=pic.files?.[0];if(!f)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type)||f.size>10*1024*1024){cover.textContent='10MB以内の画像を選択してください';return}objectUrl=URL.createObjectURL(f);const img=document.createElement('img');img.src=objectUrl;img.alt='サムネイルのプレビュー';img.style.objectFit=fit.value;img.onload=()=>download.disabled=false;cover.append(img)});download.addEventListener('click',async()=>{const img=cover.querySelector('img');if(!img||!img.complete)return;const canvas=document.createElement('canvas');canvas.width=480;canvas.height=600;const ctx=canvas.getContext('2d');ctx.fillStyle='#092347';ctx.fillRect(0,0,480,600);const w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)return;const scale=fit.value==='cover'?Math.max(480/w,600/h):Math.min(480/w,600/h);const dw=w*scale,dh=h*scale;ctx.drawImage(img,(480-dw)/2,(600-dh)/2,dw,dh);canvas.toBlob(blob=>{if(!blob){downloadInfo.textContent='画像を保存できませんでした';return}const href=URL.createObjectURL(blob),a=document.createElement('a');a.href=href;a.download='gallery-thumbnail.webp';a.click();setTimeout(()=>URL.revokeObjectURL(href),15000);downloadInfo.textContent='480×600のWebP画像を保存しました。サイトへの公開はまだ行われません。'},'image/webp',0.86)});creator.addEventListener('input',refresh);titleInput.addEventListener('input',refresh);categoryInput.addEventListener('change',refresh);const draftKey='mio-gallery-editor-draft-v1';try{const d=JSON.parse(sessionStorage.getItem(draftKey)||'null');if(d){titleInput.value=String(d.title||'').slice(0,120);categoryInput.value=String(d.category||'動画');creator.value=String(d.creator||'').slice(0,80);url.value=String(d.url||'').slice(0,2048)}}catch{}refresh();document.getElementById('copyDraft').addEventListener('click',async()=>{const data=['作品タイトル：'+titleInput.value,'カテゴリ：'+categoryInput.value,'投稿者名：'+creator.value,'作品リンク：'+url.value].join('\n');try{await navigator.clipboard.writeText(data);document.getElementById('downloadInfo').textContent='作品情報をコピーしました。画像は含まれません。'}catch{document.getElementById('downloadInfo').textContent='コピーできませんでした。端末の設定を確認してください。'}});document.getElementById('saveDraft').addEventListener('click',()=>{try{sessionStorage.setItem(draftKey,JSON.stringify({title:titleInput.value,category:categoryInput.value,creator:creator.value,url:url.value}));document.getElementById('downloadInfo').textContent='このタブの一時保存に成功しました。画像は保存されません。'}catch{document.getElementById('downloadInfo').textContent='この端末では一時保存できません。'}});document.getElementById('clearDraft').addEventListener('click',()=>{try{sessionStorage.removeItem(draftKey);document.getElementById('downloadInfo').textContent='一時保存を削除しました。'}catch{}});async function checkPublishing(){const status=document.getElementById('publishStatus');try{const r=await fetch('/api/gallery/capabilities',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();const storage=d.storageConfigured?'接続済み':'未設定';status.textContent='画像保存先：'+storage+' ／ 管理者認証：'+(d.adminAuthEnabled?'利用可能':'準備中')+' ／ 端末承認：'+(d.deviceApprovalEnabled?'利用可能':'準備中')+' ／ 公開：'+(d.publishingEnabled?'利用可能':'停止中');document.getElementById('publish').disabled=true}catch{status.textContent='準備状況を確認できません。公開機能は停止中です。'}}checkPublishing();
</script></body></html>
