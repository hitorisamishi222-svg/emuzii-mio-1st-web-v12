<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みおシステム｜ID連携・複数端末テスト</title><style>*{box-sizing:border-box}body{margin:0;background:#071b3a;color:#fff;font:16px system-ui,-apple-system,sans-serif}main{max-width:600px;margin:auto;padding:20px 14px 70px}.panel{background:rgba(4,23,52,.94);border:1px solid #8db7e788;border-radius:16px;padding:18px;margin:14px 0}h1{font-size:23px}h2{font-size:18px}p{line-height:1.6}label{display:block;margin:12px 0 6px}input{width:100%;font-size:16px;padding:12px;border-radius:9px;border:1px solid #8cb5df}button{background:#f4d999;color:#123055;border:0;border-radius:9px;padding:12px 16px;font-weight:700;margin:7px 5px 0 0;font-size:15px}button:disabled{opacity:.5}.notice{background:#12365d;border-radius:10px;padding:12px;line-height:1.7;white-space:pre-wrap}.good{color:#a9ffd4}.bad{color:#ffb9af}small{color:#c4daed}a{color:#ffe5a3}</style><link rel="stylesheet" href="/mio-approved-layout-preview.css"><script defer src="/mio-approved-background-guard.js" data-mode="normal"></script></head><body><main><section class="panel"><small>🧪 隔離テスト / 実アカウントとは無関係</small><h1>MIO-ID・ログインID・端末連携テスト</h1><p>架空の1アカウントで、ID変更・2端末ログイン・履歴の維持・権利重複防止を試せます。入力内容はサーバーに送信されず、再読み込みで初期化されます。</p></section><section class="panel"><h2>架空のアカウント</h2><div id="account" class="notice"></div><label for="alias">新しいログインID（8〜20文字、4種類中3種類以上）</label><input id="alias" placeholder="例：MioFan_2026" autocomplete="off" maxlength="20"><button id="change">IDを変更（模擬）</button><div id="feedback" class="notice" role="status">操作待ち</div></section><section class="panel"><h2>複数端末</h2><div id="devices" class="notice"></div><button id="add">サブ端末をログイン（模擬）</button><button id="revoke">サブ端末をログアウト（模擬）</button></section><section class="panel"><h2>共有ガチャ権利</h2><div id="rights" class="notice"></div><button id="drawMain">メイン端末で1回引く</button><button id="drawSub">サブ端末で1回引く</button><button id="both">2端末同時抽選を模擬</button></section><section class="panel"><h2>自動チェック</h2><button id="test">ID紐付け・履歴・端末・権利のテスト実行</button><div id="results" class="notice">未実行</div><p><small>このデモはブラウザ内の模擬状態だけを扱います。実際のサーバー認証・パスキー・並行処理の安全性を証明するものではありません。</small></p><p><a href="/device-sessions-preview.html">← 端末管理画面</a></p></section></main><script type="module">import {validateLoginId,createDemoRegistry} from '/mio-auth-rules-v21.js';(function(){'use strict';const $=id=>document.getElementById(id),initial=()=>({accountId:'TEST-ACCOUNT-001',mioId:'MIO-TEST-001',loginId:'MioFan_2026',attendance:17,wins:['テスト景品'],rights:2,sessions:new Set(['main'])});let a=initial();const validate=validateLoginId;function resolve(id){return id===a.mioId||id.toLowerCase()===a.loginId.toLowerCase()?a.accountId:null}function draw(){if(a.rights<=0)return false;a.rights--;return true}function render(){$('account').textContent='内部ID: '+a.accountId+'\nMIO-ID: '+a.mioId+'\nログインID: '+a.loginId+'\n皆勤記録: '+a.attendance+'件 / 当選履歴: '+a.wins.join('、');$('devices').textContent='メイン: ログイン中\nサブ: '+(a.sessions.has('sub')?'ログイン中':'ログアウト');$('rights').textContent='残り '+a.rights+' 回（全端末共通）';$('drawSub').disabled=!a.sessions.has('sub')}function message(t){$('feedback').textContent=t}function setAlias(v){const error=validate(v);if(error)return error;if(v.toLowerCase()===a.mioId.toLowerCase())return 'MIO-IDはログインIDとして使用できません';a.loginId=v;return ''}$('change').onclick=()=>{const error=setAlias($('alias').value);message(error||'模擬ID変更成功。MIO-ID・履歴は維持されました。');render()};$('add').onclick=()=>{a.sessions.add('sub');render()};$('revoke').onclick=()=>{a.sessions.delete('sub');render()};$('drawMain').onclick=()=>{message(draw()?'メイン端末で模擬抽選しました':'権利がありません');render()};$('drawSub').onclick=()=>{if(!a.sessions.has('sub'))return;message(draw()?'サブ端末で模擬抽選しました':'権利がありません');render()};$('both').onclick=()=>{if(!a.sessions.has('sub')){message('先にサブ端末をログインしてください');return}const before=a.rights,first=draw(),second=draw();message('2端末の連続抽選模擬: '+Number(first)+Number(second)+'回 / 権利 '+before+' → '+a.rights+'。実サーバーでの同時実行保証ではありません。');render()};$('test').onclick=()=>{const old=a;a=initial();const checks=[];const check=(name,pass)=>checks.push((pass?'✓ 合格：':'× 失敗：')+name+(pass?'':' — 判定が一致しません。ID重複・入力値・端末状態を確認してください。'));check('MIO-IDから固定アカウントを参照',resolve(a.mioId)===a.accountId);const previous=a.loginId;const error=setAlias('NewMio_2026');check('新ログインIDの形式と変更',!error&&a.loginId==='NewMio_2026');check('新IDから同じアカウントを参照',resolve('NewMio_2026')===a.accountId);check('旧ログインIDは無効',resolve(previous)===null);check('MIO-ID・皆勤・当選履歴を保持',a.mioId==='MIO-TEST-001'&&a.attendance===17&&a.wins.length===1);a.sessions.add('sub');check('メイン・サブが同時ログイン',a.sessions.size===2);a.sessions.delete('sub');check('サブのみログアウト',a.sessions.has('main')&&!a.sessions.has('sub'));const x=draw(),y=draw(),z=draw();check('残権利2回で抽選成功は2回まで',x&&y&&!z&&a.rights===0);check('不正なIDを拒否',!!validate('abc'));const registry=createDemoRegistry();const demo=registry.register({accountId:'A-1',mioId:'MIO-1',loginId:'MioUser_2026',attendance:17,rights:2});check('共通ルールでMIO-IDとログインIDが同じアカウント',registry.resolve('MIO-1')===demo&&registry.resolve('MioUser_2026')===demo);registry.changeLoginId('A-1','NewUser_2026');check('共通ルールで旧ID失効と履歴保持',registry.resolve('MioUser_2026')===null&&registry.resolve('NewUser_2026')===demo&&demo.attendance===17);registry.signIn('A-1','iphone');registry.signIn('A-1','android');registry.signOut('A-1','android');check('共通ルールでサブ端末だけ失効',demo.sessions.has('iphone')&&!demo.sessions.has('android'));const d1=registry.consumeRight('A-1'),d2=registry.consumeRight('A-1'),d3=registry.consumeRight('A-1');check('共通ルールで権利上限を維持',d1&&d2&&!d3&&demo.rights===0);$('results').textContent=checks.join('\n')+'\n合格 '+checks.filter(x=>x.startsWith('✓')).length+'/'+checks.length+'（ブラウザ内の模擬テスト）';a=old;render()};render()})();</script></body></html>
