<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>追加端末の復旧</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fc;color:#142b4a;margin:0;padding:24px}main{max-width:540px;margin:auto;background:white;padding:24px;border-radius:18px}button,textarea{font:inherit;width:100%;box-sizing:border-box;padding:12px;margin:8px 0}button{background:#1559b7;color:white;border:0;border-radius:8px}textarea{min-height:90px}code{overflow-wrap:anywhere}p{line-height:1.7}.note{color:#a23821}</style></head><body><main><h1>追加端末の復旧</h1><p>管理者の本人確認が済んだ方専用です。新規登録は行いません。</p><button id="prepare">この端末の認証コードを作成</button><p>次の64文字の認証ハッシュだけを管理者に伝えてください。元の端末の情報は不要です。</p><p><code id="proof">未発行</code></p><label for="grant">管理者から届いた復旧許可（JSON）</label><textarea id="grant" placeholder='{"grant":{...},"signature":"..."}'></textarea><button id="redeem" disabled>この端末を復旧する</button><p class="note" id="message" role="status" aria-live="polite">復旧許可の有効期限は発行後5分間です。</p></main><script type="module">const el=id=>document.getElementById(id);let token=null;const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');el('prepare').onclick=async()=>{token=hex(crypto.getRandomValues(new Uint8Array(32)));const proof=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token)));el('proof').textContent=proof;el('redeem').disabled=false;el('message').textContent='認証ハッシュを管理者へ安全に送ってください。端末を閉じると最初からになります。';};el('redeem').onclick=async()=>{if(!token)return;el('redeem').disabled=true;try{const data=JSON.parse(el('grant').value);const response=await fetch('/api/device-enroll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grant:data.grant,signature:data.signature,deviceToken:token}),credentials:'same-origin'});const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'復旧できませんでした');token=null;el('message').textContent='復旧が完了しました。参加状況を確認してください。';}catch(e){el('message').textContent=e.message;el('redeem').disabled=false;}};</script></body></html>
