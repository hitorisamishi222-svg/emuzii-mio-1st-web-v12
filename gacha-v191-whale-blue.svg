<ellipse cx="559" cy="265" rx="8" ry="10" fill="#fff"/>
<circle cx="578" cy="288" r="4" fill="#fff"/>
<ellipse cx="582" cy="315" rx="25" ry="13" fill="#ffaac9" opacity=".88"/>
<path d="M589 358 Q611 372 635 353" fill="none" stroke="#25628b" stroke-width="5" stroke-linecap="round"/>
<ellipse cx="625" cy="339" rx="7" ry="4" fill="#418bb5" opacity=".6"/>
