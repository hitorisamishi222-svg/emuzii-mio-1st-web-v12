<linearGradient id="v2metal" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff" stop-opacity=".78"/><stop offset=".22" stop-color="#c2f4ff" stop-opacity=".26"/><stop offset=".52" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#00112b" stop-opacity=".25"/></linearGradient><radialGradient id="v2lens" cx=".25" cy=".16" r=".85"><stop stop-color="#fff" stop-opacity=".43"/><stop offset=".3" stop-color="#fff" stop-opacity=".08"/><stop offset=".78" stop-color="#66dfff" stop-opacity=".09"/><stop offset="1" stop-color="#061634" stop-opacity=".37"/></radialGradient></defs>

