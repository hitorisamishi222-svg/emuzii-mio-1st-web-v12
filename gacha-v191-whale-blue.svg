<path d="M158 335 Q94 269 40 288 Q15 319 70 356 Q25 376 47 415 Q105 445 170 384Z" fill="url(#skin)" stroke="url(#metal)" stroke-width="11" stroke-linejoin="round"/>
<path d="M69 314 Q104 316 131 343" fill="none" stroke="#fff" stroke-width="8" opacity=".55" stroke-linecap="round"/>
