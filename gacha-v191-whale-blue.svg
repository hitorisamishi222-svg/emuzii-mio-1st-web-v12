<path d="M486 479 Q551 463 589 498 Q609 525 571 546 Q528 551 477 505" fill="url(#skin)" stroke="url(#metal)" stroke-width="9"/>
<path d="M516 490 Q550 491 567 509" fill="none" stroke="#fff" stroke-width="6" opacity=".48" stroke-linecap="round"/>
