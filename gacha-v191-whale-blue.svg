<path d="M460 460 Q436 489 398 499" fill="none" stroke="#fff" stroke-width="7" opacity=".2" stroke-linecap="round"/>
<!-- projecting friendly whale face outside dome -->
<path d="M531 221 Q594 199 632 257 Q663 307 645 354 Q630 397 568 393 Q540 375 542 342" fill="url(#skin)" stroke="#f2feff" stroke-width="8" stroke-linejoin="round"/>
<path d="M575 331 Q610 314 647 334 Q653 366 617 381 Q581 387 563 359Z" fill="#b9f6ff" stroke="#f2feff" stroke-width="4"/>
<ellipse cx="564" cy="273" rx="25" ry="30" fill="#fff"/>
