<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-label="ブルーのジュエリーガチャクジラ">
<defs>
<linearGradient id="skin" x1=".13" y1="0" x2=".83" y2="1"><stop stop-color="#83eaff"/><stop offset=".46" stop-color="#239cdd"/><stop offset="1" stop-color="#1160b2"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".3" stop-color="#b9f6ff"/><stop offset=".58" stop-color="#7cddf4"/><stop offset=".78" stop-color="#fff"/><stop offset="1" stop-color="#7cddf4"/></linearGradient>
<radialGradient id="glass" cx=".28" cy=".18" r=".94"><stop stop-color="#fff" stop-opacity=".29"/><stop offset=".35" stop-color="#b9f6ff" stop-opacity=".07"/><stop offset=".78" stop-color="#7edaff" stop-opacity=".08"/><stop offset="1" stop-color="#092657" stop-opacity=".4"/></radialGradient>
<linearGradient id="whitebelly" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b9f6ff"/></linearGradient>
<radialGradient id="eye"><stop stop-color="#5e9df4"/><stop offset=".6" stop-color="#133773"/><stop offset="1" stop-color="#08132d"/></radialGradient>
</defs>
<!-- the machine is a single whale-shaped toy, not decorations stuck onto a whale -->
<ellipse cx="350" cy="652" rx="226" ry="24" fill="#061c42" opacity=".25"/>
