<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06193e"><title>トップ要約型デモ｜翠央1周年</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/backgrounds.css"><link rel="stylesheet" href="/home-updates.css"><link rel="stylesheet" href="/next-premium-v2.css"><style>
.demo-switcher{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.demo-switcher button{border:1px solid #84ddff66;border-radius:999px;background:#082b5c;color:#e8f9ff;padding:8px 12px;font-weight:800;font-size:12px}.demo-note{font-size:11px;color:#abc9df}
</style></head><body class="next-premium-home"><main class="app">
<header><span class="brand">翠央 1周年</span><span class="version">v1.9.3 DEMO</span><p>SMARTPHONE TOP PREVIEW</p></header>
<div class="hero"><span>2026.10.01 — 10.31</span><h1>翠央と彩る、<br>1周年のひと月。</h1><p>背景の顔が見える位置から、下へスクロールして最新情報へ。</p></div>
<section class="glass"><h2>表示パターン</h2><div class="demo-switcher"><button data-mode="live">配信中あり</button><button data-mode="next">次回予定のみ</button><button data-mode="quiet">お知らせだけ</button><button data-mode="empty">情報なし</button></div><p class="demo-note">このデモは本番データへ書き込みません。</p></section>
<section class="glass home-top-info" id="homeUpdates"><div class="home-updates-head"><div><span class="home-updates-kicker">LATEST INFORMATION</span><h2>最新情報</h2></div><p class="home-updates-status" id="homeUpdatesStatus">表示デモ</p></div>
<div id="homeLiveBanner" hidden></div><div class="home-top-links">
<a class="home-summary-card news" href="/news.html"><div class="home-summary-title"><b>📢 お知らせ</b><span>NEWS</span></div><div id="homeNewsSummary"></div></a>
<a class="home-summary-card schedule" href="/schedule.html"><div class="home-summary-title"><b>📅 配信予定</b><span>LIVE</span></div><div id="homeScheduleSummary"></div></a>
</div></section>
<section class="glass"><h2>イベントに参加</h2><div class="events"><article><span class="icon">🎯</span><h3>1周年予想</h3><p>ここから既存イベントカードへ続きます。</p></article><article><span class="icon">💎</span><h3>メンシプガチャ</h3><p>ガチャなど既存機能はこの下へ続きます。</p></article></div></section>
</main><script>
const t=()=>Date.now();
const modes={
live:()=>({ok:true,serverTime:new Date().toISOString(),notices:[{id:"N1",level:"重要",title:"本日の配信について",body:"最新のお知らせ",publishedAt:new Date(t()-3600000).toISOString(),expiresAt:new Date(t()+86400000).toISOString()}],schedules:[{id:"L1",startAt:new Date(t()-900000).toISOString(),endAt:new Date(t()+4500000).toISOString(),title:"1周年記念 歌枠",body:"ただいま配信中です",url:"https://colorsing.com/"},{id:"L2",startAt:new Date(t()+86400000).toISOString(),endAt:new Date(t()+93600000).toISOString(),title:"明日の歌・雑談枠",body:"",url:""}]}),
next:()=>({ok:true,serverTime:new Date().toISOString(),notices:[{id:"N1",level:"通常",title:"今週のお知らせ",body:"",publishedAt:new Date(t()-3600000).toISOString()}],schedules:[{id:"L2",startAt:new Date(t()+7200000).toISOString(),endAt:new Date(t()+14400000).toISOString(),title:"今夜の歌枠",body:"",url:""}]}),
quiet:()=>({ok:true,serverTime:new Date().toISOString(),notices:[{id:"N1",level:"重要",title:"1周年企画のお知らせ",body:"",publishedAt:new Date(t()-3600000).toISOString()}],schedules:[]}),
empty:()=>({ok:true,serverTime:new Date().toISOString(),notices:[],schedules:[]})
};
window.__MIO_HOME_DEMO__=modes.live();
document.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;window.__MIO_HOME_DEMO__=modes[b.dataset.mode]();window.__MIO_HOME_DEMO_REFRESH__?.()});
</script><script type="module" src="/home-updates.js"></script></body></html>
