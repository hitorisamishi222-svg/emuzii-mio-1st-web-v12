<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ガチャ操作テスト（抽選なし）</title><style>body{background:#061a39;color:#fff;font:16px system-ui;text-align:center;padding:24px}button{padding:20px;border-radius:16px;background:#e8c15b;color:#132446;font-size:20px;font-weight:bold;border:0}.orb{margin:40px auto;width:150px;height:150px;border-radius:50%;background:#75d7ff;box-shadow:0 0 25px #6cf;transition:transform .6s,box-shadow .6s}.orb.active{transform:scale(1.2);box-shadow:0 0 80px 35px #ffdb6a;background:#ffd96c}</style></head><body><h1>🐳 ガチャ動作確認</h1><p>開発ブランチ専用・実際の抽選は行いません</p><div class="orb" id="orb"></div><button id="test" type="button">💎 発光テスト</button><p id="status" role="status">ボタンを押してね</p><script>document.getElementById('test').onclick=function(){var o=document.getElementById('orb');o.classList.toggle('active');document.getElementById('status').textContent=o.classList.contains('active')?'✨ タップ成功！発光中':'💎 待機中';};</script></body></html>
