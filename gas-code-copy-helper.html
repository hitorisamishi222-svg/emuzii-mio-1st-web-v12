<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>翠央1周年 | アサヒ修正版コードコピー</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#f7f8fc;color:#171b2a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
main{width:min(560px,100%);margin:0 auto;padding:24px 18px 56px}
h1{font-size:1.35rem;line-height:1.4;margin:16px 0}
p{line-height:1.75}
.box{background:white;border:1px solid #e2e6f0;border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 6px 28px #18203c0b}
.tag{font-size:0.85rem;color:#4c5774}
button,.link{display:block;width:100%;padding:17px 12px;border-radius:12px;font-size:1rem;font-weight:700;text-align:center;cursor:pointer}
button{border:0;color:white;background:#225ed8}
button:disabled{background:#a8b0c0;cursor:not-allowed}
.link{margin-top:14px;border:1px solid #ccd5e8;text-decoration:none;color:#2153bd;background:#fff}
#state{margin:15px 0 0;font-weight:600;min-height:3.5em;white-space:pre-wrap}
.note{font-size:.87rem;color:#505b76;line-height:1.8}
code{font-size:.81rem;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<p class="tag">ASAHI / みおシステム・更新補助</p>
<h1>修正版コードを1タップでコピー</h1>
<p>660行を長押しで選択する必要はありません。まずコードを自動照合してから、コピー用ボタンが使えるようになります。</p>
<section class="box" aria-label="修正版コピー">
<p><strong>Code.gs 修正版 v1.9.6</strong></p>
<p class="tag">改変検知（SHA-256）付き・本番データ操作なし</p>
<button id="copy" type="button" disabled>コードを確認しています…</button>
<p role="status" aria-live="polite" id="state">修正版を読み込んでいます…</p>
<a class="link" id="open-gas" href="https://script.google.com/home/projects/11cJZBh9YzbFTd9ciqMbfgOWdfUEtfAbLAhdvkYipxT0B0_cMhes_xmJe/edit" rel="noreferrer" hidden>コピーできたら既存GASを開く</a>
</section>
<p class="note">ここではコードをクリップボードにコピーするだけ。GASの保存・公開・実行や、参加者・皆勤・ガチャの更新は一切行いません。<strong>GAS上での置き換えとデプロイは、アサヒの確認があるまでしないでください。</strong></p>
</main>
<script>
'use strict';
const FILE='/APPS_SCRIPT_Code_v1.9.6_DISABLE_NAME_ONLY_APPROVE.gs';
const EXPECTED_SHA256='f4bb1bd301e1ec9306690c39197b597ced6118124d1a3dc1aefd12374353f390';
const el=document.getElementById('copy');
const statusEl=document.getElementById('state');
let verifiedCode='';
const update=s=>{statusEl.textContent=s};
(async()=>{
try{
 const response=await fetch(FILE,{cache:'no-store'});
 if(!response.ok)throw Error('修正版を取得できません（HTTP '+response.status+'）');
 const buf=await response.arrayBuffer();
 if(!crypto?.subtle)throw Error('安全な改変チェックを利用できません');
 const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buf)),b=>b.toString(16).padStart(2,'0')).join('');
 if(hash!==EXPECTED_SHA256)throw Error('修正版の内容が確認済みファイルと一致しません');
 const text=new TextDecoder('utf-8',{fatal:true}).decode(buf);
 if(!text.includes('v1.9.6 SECURITY HOTFIX')||!text.includes('function doPost(e)')||!text.endsWith('\n'))throw Error('修正版の形式を確認できません');
 verifiedCode=text;
 el.disabled=false;
 el.textContent='修正版コードをコピー';
 update('照合完了。下のボタンを押すだけで、コード全文をコピーできます。');
}catch(error){
 el.disabled=true;
 update('安全確認のためコピーを停止しました。アサヒに画面を見せてください。\n'+String(error.message||error));
}
})();
el.addEventListener('click',async()=>{
 if(!verifiedCode||el.disabled)return;
 try{
   if(!navigator.clipboard?.writeText)throw Error('Clipboard API unavailable');
   await navigator.clipboard.writeText(verifiedCode);
 }catch{
   // Old iOS WebViews: maintain selection and focus while copying on click.
   const textarea=document.createElement('textarea');
   textarea.value=verifiedCode;
   textarea.setAttribute('readonly','');
   textarea.style.cssText='position:fixed;top:10px;left:10px;width:1px;height:1px;opacity:0';
   document.body.append(textarea);
   textarea.focus();textarea.select();textarea.setSelectionRange(0,textarea.value.length);
   const copied=typeof document.execCommand==='function'&&document.execCommand('copy');
   textarea.remove();
   if(!copied){
     update('このブラウザではコピーを許可できませんでした。アサヒに画面を見せてください。');
     return;
   }
 }
 update('✅ コード全文をコピーしました。次はアサヒに「コピー完了」と伝えてください。');
 document.getElementById('open-gas').hidden=false;
});
</script>
</body>
</html>
