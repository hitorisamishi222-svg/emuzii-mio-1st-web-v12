<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" role="img" aria-label="光る海底王宮の背景">
<defs>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#1c638f"/><stop offset=".30" stop-color="#164c79"/><stop offset=".68" stop-color="#123864"/><stop offset="1" stop-color="#071b3d"/></linearGradient>
 <radialGradient id="sanctuary"><stop stop-color="#a0e8f2" stop-opacity=".55"/><stop offset=".46" stop-color="#55b2d8" stop-opacity=".26"/><stop offset="1" stop-color="#153c72" stop-opacity="0"/></radialGradient>
 <linearGradient id="marble" x2="1" y2="0"><stop stop-color="#17345b"/><stop offset=".2" stop-color="#9ddef1"/><stop offset=".38" stop-color="#3b749a"/><stop offset=".73" stop-color="#1c456e"/><stop offset=".9" stop-color="#e2dbb0"/><stop offset="1" stop-color="#1c3c64"/></linearGradient>
 <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff3c3"/><stop offset=".32" stop-color="#e6be6e"/><stop offset=".71" stop-color="#916b3e"/><stop offset="1" stop-color="#eddbac"/></linearGradient>
 <linearGradient id="portal" x2="0" y2="1"><stop stop-color="#d1faff" stop-opacity=".62"/><stop offset=".27" stop-color="#6bc9e8" stop-opacity=".29"/><stop offset=".85" stop-color="#244d86" stop-opacity=".02"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#68c4e2" stop-opacity=".55"/><stop offset=".18" stop-color="#23548b" stop-opacity=".3"/><stop offset="1" stop-color="#09213f"/></linearGradient>
 <radialGradient id="gem"><stop stop-color="#e9ffff"/><stop offset=".36" stop-color="#95f1ff"/><stop offset=".9" stop-color="#1f92b7"/></radialGradient>
 <filter id="haze"><feGaussianBlur stdDeviation="35"/></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
