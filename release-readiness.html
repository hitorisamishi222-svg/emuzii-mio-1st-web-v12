<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大型更新・統合検証｜翠央1周年</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#06132e,#0d3561);color:#eef8ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:20px 14px 60px}a{color:#9ce7ff}h1{font-size:24px}h2{font-size:17px;margin:0 0 10px}section{padding:16px;border:1px solid #7fd6ff55;border-radius:18px;background:#0b2247;margin:12px 0}p,li{line-height:1.7}.muted{color:#b5d1e8;font-size:13px}.status{display:inline-block;border-radius:40px;background:#533b17;color:#ffe2a2;padding:3px 10px;font-size:12px}label{display:block;padding:9px 0;border-bottom:1px solid #ffffff22}input{accent-color:#7fe2ff;width:20px;height:20px;vertical-align:middle;margin-right:8px}button{border:1px solid #9ce7ff;background:#123a70;color:white;border-radius:10px;padding:12px;font:inherit}nav a{display:inline-block;margin:6px 12px 6px 0}.warning{border-color:#ffc16b;background:#3b271a}#progress{font-weight:bold}</style></head><body><main><nav><a href="/home-portrait-next.html">← 採用トップ</a><a href="/next-preview.html">機能一覧</a><a href="/mobile-checklist.html">スマホ確認</a></nav><h1>🧭 大型更新・統合検証</h1><p class="muted">開発版専用。ここでのチェックはこのブラウザ内の作業メモであり、本番公開の承認にはなりません。サーバーへは送信しません。</p><section class="warning"><h2>🔒 公開停止条件</h2><p>実参加者のデータ・ガチャ権利・管理設定を使った試験は禁止。API／GAS／Sheetのテストデータ分離とバックアップ、切戻し方法が確認できるまで本番に接続しない。</p></section><p id="progress" aria-live="polite">確認項目を読み込み中…</p><div id="checks"></div><section><h2>リリース前の最終判断</h2><p>すべての項目が実環境で確認済みになっても、本番への一括反映には管理者の明示的な承認が必要です。コードのロールバックとSheet等のデータ復旧は別手順です。</p><button id="clear" type="button">この端末のチェックをリセット</button></section></main><script>
const groups=[
['テスト環境の安全',['プレビューが本番抽選APIを呼ばない','GAS・Sheet・参加者データがテスト用に分離されている','本番データのバックアップと復旧手順を確認','本番への切替・全体ロールバック手順を確認']],
['ガチャ',['クジラの見た目・ハンドル・カプセル動作','N/R/SR/URの演出差と当選カード','ラキフェス解放条件と景品確率','連打・通信切断・再読み込み・二重抽選防止','残回数・履歴・管理公開スイッチが一致']],
['皆勤・キーワード',['31日分の日付表示と後日入力','1日2回の制限と日付境界','キーワード入力・訂正・重複対策','皆勤達成と記念表示']],
['ログイン・端末切替',['MIO-IDの重複登録防止','ブラウザを変えた際の既存IDの扱い','本人確認後の新端末承認と旧端末無効化','皆勤・ガチャ・当選・FA履歴の保持']],
['管理画面',['管理者認証と権限制御','ガチャ公開スイッチの即時反映','景品登録・在庫・当選履歴・交換管理','承認待ち・重複整理・監査ログ']],
['ギャラリー・コミュニティ',['作品投稿と管理者承認','画像・動画・音楽の表示と再生','公開範囲・削除・不適切投稿対策','投稿者プロフィールとリンク']],
['スマホ品質・公開',['iPhone SafariとAndroidブラウザで操作','通信低速・画面回転・戻る・復帰','読みやすさ・タップ領域・音量・動き軽減','全体結合試験と公開可否の最終確認']]
];
const key='mio_release_readiness_local_v1',state=(()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}})();const root=document.getElementById('checks');let total=0;
groups.forEach(([name,items],g)=>{const sec=document.createElement('section'),h=document.createElement('h2');h.textContent=name;sec.append(h);items.forEach((item,i)=>{const id=g+'-'+i;total++;const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=state[id]===true;c.addEventListener('change',()=>{state[id]=c.checked;try{localStorage.setItem(key,JSON.stringify(state))}catch{}update()});l.append(c,document.createTextNode(item));sec.append(l)});root.append(sec)});
function update(){const n=[...document.querySelectorAll('#checks input')].filter(x=>x.checked).length;document.getElementById('progress').textContent='端末内チェック '+n+' / '+total+' 件（実機検証の記録）'}update();
document.getElementById('clear').onclick=()=>{if(!confirm('この端末のチェックを全てリセットしますか？'))return;Object.keys(state).forEach(k=>delete state[k]);try{localStorage.removeItem(key)}catch{}document.querySelectorAll('#checks input').forEach(x=>x.checked=false);update()};
</script></body></html>
