<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>みお｜復旧ID登録（Preview検証用）</title><link rel="stylesheet" href="/mio-recovery-vnext.css"></head><body><main><p class="tag">Preview検証用 · 合成データ専用</p><h1>復旧IDで登録</h1><p>この画面は隔離Preview専用です。みおから受け取った名前と復旧IDを入力してください。実際の会員・ガチャ・皆勤データには接続しません。</p><form id="form"><label for="name">登録する名前</label><input id="name" name="name" autocomplete="off" maxlength="80" required placeholder="みおに伝えた名前"><label for="code">復旧ID</label><input id="code" name="code" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required maxlength="51" placeholder="MIO-ACCESS-…"><button id="show" type="button" class="secondary" aria-pressed="false">IDを表示</button><button id="submit" type="submit">登録する</button></form><p id="status" role="status" aria-live="polite"></p><p class="note">登録後はこのブラウザを使用してください。機種変更などの場合は、みおに再発行を依頼してください。</p></main><script type="module" src="/mio-recovery-vnext.js"></script></body></html>
