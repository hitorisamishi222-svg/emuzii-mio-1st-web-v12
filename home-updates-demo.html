<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06193e"><title>お知らせ・配信予定 デモ</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/backgrounds.css"><link rel="stylesheet" href="/home-updates.css"><style>
.demo-switcher{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.demo-switcher button{border:1px solid #84ddff66;border-radius:999px;background:#082b5c;color:#e8f9ff;padding:8px 12px;font-weight:800;font-size:12px}.demo-switcher button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style><link rel="stylesheet" href="/next-return.css"></head>
<body><main class="app"><header><span class="brand">翠央 1周年</span><span class="version">v1.9.2 DEMO</span><p>HOME INFORMATION PREVIEW</p></header><a class="next-return-link" href="/next-integrated.html">← 大型更新・統合ホームへ戻る</a>
<div class="hero"><span>公開前プレビュー</span><h1>お知らせ・配信予定<br>表示デモ</h1><p>本番データには接続せず、見た目と表示順を確認できます。</p></div>
<section class="glass"><h2>表示パターン切替</h2><div class="demo-switcher">
<button data-scenario="standard">標準</button><button data-scenario="empty">空表示</button><button data-scenario="long">長文</button><button data-scenario="news">お知らせのみ</button><button data-scenario="schedule">予定のみ</button><button data-scenario="live">LIVE＋次回</button>
</div><p class="muted">どのボタンを押しても本番データは変わりません。</p></section>
<section class="glass home-updates" id="homeUpdates" aria-labelledby="homeUpdatesTitle"><div class="home-updates-head"><div><span class="home-updates-kicker">LATEST INFORMATION</span><h2 id="homeUpdatesTitle">📢 お知らせ・配信予定</h2></div><p class="home-updates-status" id="homeUpdatesStatus" aria-live="polite">読み込み中…</p></div><div class="home-update-grid">
<section class="home-panel"><div class="home-panel-title"><h3>お知らせ掲示板</h3><small>NEWS</small></div><div class="home-news-list" id="homeNewsList"></div></section>
<section class="home-panel"><div class="home-panel-title"><h3>配信スケジュール</h3><small>LIVE SCHEDULE</small></div><div class="home-schedule-list" id="homeScheduleList"></div></section>
</div></section>
<section class="glass"><h2>デモについて</h2><p class="muted">このページは表示確認専用です。参加者情報・ガチャ・皆勤・Apps Scriptには書き込みません。</p></section>
</main>
<script>
const now=()=>Date.now();
const standard=()=>({ok:true,notices:[
{id:"NEWS-DEMO-1",level:"緊急",title:"本日の配信時間変更",body:"開始時間を22:00に変更しました。お間違えのないようご確認ください。",publishedAt:new Date(now()-20*60*1000).toISOString(),expiresAt:new Date(now()+4*60*60*1000).toISOString(),url:""},
{id:"NEWS-DEMO-2",level:"重要",title:"1周年企画のお知らせ",body:"今月の企画・ガチャ・ファンアートを開催中です。最新情報はこちらで随時更新します。",publishedAt:new Date(now()-2*60*60*1000).toISOString(),expiresAt:new Date(now()+7*24*60*60*1000).toISOString(),url:"https://emuzii-mio-1st-web-v12.vercel.app/"},
{id:"NEWS-DEMO-3",level:"通常",title:"お知らせ掲示板を追加しました",body:"配信変更やイベント情報をトップページですぐ確認できます。",publishedAt:new Date(now()-4*24*60*60*1000).toISOString(),url:""}
],schedules:[
{id:"LIVE-DEMO-1",startAt:new Date(now()-20*60*1000).toISOString(),endAt:new Date(now()+100*60*1000).toISOString(),title:"1周年記念 歌枠",body:"現在配信中の表示イメージです。",url:"https://colorsing.com/"},
{id:"LIVE-DEMO-2",startAt:new Date(now()+24*60*60*1000).toISOString(),endAt:new Date(now()+26*60*60*1000).toISOString(),title:"明日の配信予定",body:"歌・雑談を予定しています。",url:""}
]});
const scenarios={
standard,
empty:()=>({ok:true,notices:[],schedules:[]}),
long:()=>({ok:true,notices:[{id:"LONG",level:"重要",title:"とても長いタイトルでもスマートフォンの画面からはみ出さずに折り返して表示できることを確認するためのお知らせタイトルです",body:"長文表示の確認です。".repeat(35),publishedAt:new Date(now()-60*1000).toISOString(),expiresAt:new Date(now()+86400000).toISOString(),url:""}],schedules:[{id:"LONG-LIVE",startAt:new Date(now()+3600000).toISOString(),endAt:new Date(now()+10800000).toISOString(),title:"長い配信タイトルでも表示崩れを起こさないことを確認するためのテスト配信予定",body:"配信内容の説明文が長い場合の折り返し表示を確認します。".repeat(10),url:""}]}),
news:()=>({ok:true,notices:standard().notices,schedules:[]}),
schedule:()=>({ok:true,notices:[],schedules:standard().schedules}),
live:()=>({ok:true,notices:[standard().notices[1]],schedules:[
{id:"LIVE-NOW",startAt:new Date(now()-10*60*1000).toISOString(),endAt:new Date(now()+50*60*1000).toISOString(),title:"ただいま配信中",body:"赤いLIVE表示を確認できます。",url:"https://colorsing.com/"},
{id:"NEXT",startAt:new Date(now()+2*60*60*1000).toISOString(),endAt:new Date(now()+4*60*60*1000).toISOString(),title:"次回配信",body:"配信終了後はこちらがNEXT LIVEになります。",url:""}
]})
};
window.__MIO_HOME_DEMO__=standard();
document.addEventListener('click',e=>{const b=e.target.closest('[data-scenario]');if(!b)return;const fn=scenarios[b.dataset.scenario];if(!fn)return;window.__MIO_HOME_DEMO__=fn();window.__MIO_HOME_DEMO_REFRESH__?.();});
</script><script type="module" src="/home-updates.js"></script></body></html>
