<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07192f">
<title>翠央っ子ギャラリー｜翠央記念館・大型更新コピー</title>
<meta name="description" content="翠央1周年の以前から公開している音楽・動画を大型更新コピーで確認するためのギャラリー。">
<link rel="stylesheet" href="/museum.css">
<style>
.museum-approved-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:24px}
.museum-approved-card{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;border-radius:20px;padding:16px;border:1px solid #ead19c9c;background:radial-gradient(circle at 88% 8%,#c5a56d42,transparent 32%),linear-gradient(148deg,#224770,#071d3c);box-shadow:inset 0 0 0 1px #adddf625,0 14px 39px #0008}
.museum-approved-card[hidden]{display:none}
.museum-approved-card img{display:block;width:100%;height:210px;object-fit:contain;border-radius:14px;background:#07192d}
.museum-approved-card h2{font-size:20px;margin:0;line-height:1.5}
.museum-approved-card p{line-height:1.7;margin:0}
.museum-approved-card audio{width:100%;min-height:48px}
.museum-approved-card a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#ffe2a3;color:#071d38;padding:12px 16px;border-radius:14px;min-height:48px;font-weight:800}
.museum-approved-card a:focus-visible{outline:3px solid #8ffaff;outline-offset:2px}
.museum-approved-card::before{content:'✦';position:absolute;top:7px;right:12px;color:#ffe6ab;pointer-events:none}
.museum-approved-card img{border:1px solid #f2d8a263;box-shadow:0 10px 26px #0007}
.museum-approved-grid{padding:6px 2px 12px}
#approvedMain>h1{color:#fff0d2;text-shadow:0 0 27px #edcf9744}
.museum-approved-label{font-size:12px;color:#f8dca8;font-weight:800}
.museum-approved-tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:20px 0}
.museum-approved-tools label{font-size:15px;font-weight:700}
.museum-approved-tools input{flex:1 1 240px;min-width:0;min-height:48px;font:16px system-ui,sans-serif;color:#fff;background:#102e51;border:1px solid #9ed9ff;border-radius:12px;padding:10px}
.museum-approved-filters{display:flex;flex-wrap:wrap;gap:8px}
.museum-approved-filters button{min-height:48px;border-radius:12px;padding:10px 16px;border:1px solid #9ed9ff;background:#11345d;color:#fff;font:700 15px system-ui,sans-serif;cursor:pointer}
.museum-approved-filters button[aria-pressed="true"]{background:#ffe2a3;color:#071d38}
.museum-approved-tools :focus-visible{outline:3px solid #8ffaff;outline-offset:2px}
.museum-approved-card .museum-approved-permalink{margin-top:auto;min-height:44px;border:1px solid #9bcceb;background:#12385a;color:#f3e5bf;padding:9px 14px;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.museum-approved-card .museum-approved-permalink:focus-visible{outline:3px solid #8ffaff;outline-offset:3px}
.museum-approved-focus{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid #e9cd92;border-radius:14px;background:#173e60;margin:14px 0}
.museum-approved-focus p{margin:0;font-size:14px;color:#ffebc8;line-height:1.6}
.museum-approved-focus button{border:1px solid #eed59e;border-radius:11px;background:#ffe2a3;color:#071d38;font:bold 14px system-ui,sans-serif;min-height:44px;padding:9px 14px;cursor:pointer}
.museum-approved-focus[hidden]{display:none}
@media(max-width:620px){.museum-approved-grid{grid-template-columns:1fr}.museum-approved-card img{height:180px}}
</style></head><body class="museum">
<div role="status" style="padding:12px 16px;background:#0f3157;border-bottom:2px solid #ffe29b;text-align:center;color:#fff">
🧪 大型アップデート用コピー版。以前から公開している作品の閲覧確認用で、ログイン・投稿・ガチャ・個人情報には接続しません。
</div>
<a class="museum-skip" href="#approvedMain">作品一覧へ移動</a>
<header class="museum-header"><div class="museum-shell museum-bar">
<a class="museum-brand" href="/museum.html">🐳 翠央記念館 <small>MIO MEMORIAL MUSEUM</small></a>
<nav class="museum-nav" aria-label="メニュー">
<a href="/museum.html">記念館トップ</a>
<a href="/museum-approved-gallery.html" aria-current="page">公開済み作品</a>
<a href="/museum-archive.html">思い出の展示室</a>
<a href="/mio-profile.html">翠央を知る</a>
</nav></div></header>
<main id="approvedMain" class="museum-shell" style="padding-top:32px">
<div class="museum-eyebrow">CURATED GALLERY • APPROVED WORKS</div>
<h1>💎 翠央っ子ギャラリー</h1>
<p>以前から掲載している動画・音楽を引き継いでいます。ここに表示されるのはコピーに取り込んだ公開作品のみで、管理中の新規作品や非公開作品は表示しません。</p>
<div class="museum-approved-tools">
 <label for="approvedGallerySearch">公開作品を探す</label>
 <input id="approvedGallerySearch" type="search" placeholder="作品名・制作者で検索" autocomplete="off">
 <div class="museum-approved-filters" role="group" aria-label="作品の種類">
  <button type="button" data-gallery-kind="all" aria-pressed="true">すべて</button>
  <button type="button" data-gallery-kind="動画" aria-pressed="false">動画</button>
  <button type="button" data-gallery-kind="音声・楽曲" aria-pressed="false">音楽</button>
 </div>
</div>
<div id="approvedGalleryStatus" role="status" aria-live="polite">公開済み作品の一覧を確認しています…</div>
<div id="approvedGalleryFocus" class="museum-approved-focus" hidden>
 <p id="approvedGalleryFocusText">作品を1件表示しています。</p>
 <button type="button" id="approvedGalleryClear">一覧に戻る</button>
</div>
<section id="approvedGalleryItems" class="museum-approved-grid" aria-label="以前から公開している作品一覧"></section>
<p style="margin-top:30px"><a class="museum-button secondary" href="/museum.html#mioAwakening">記念曲と動画の展示へ戻る</a></p>
</main>
<script type="module" src="/museum-approved-gallery.js"></script></body></html>
