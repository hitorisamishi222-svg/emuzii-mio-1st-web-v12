<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>お知らせ管理｜翠央1周年</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:linear-gradient(150deg,#07152f,#123c70,#081932);color:#f3faff;font:16px/1.7 system-ui,-apple-system,sans-serif}main{max-width:780px;margin:auto;padding:20px 16px 90px}a{color:#b7e6ff}h1{font-size:26px}h2{font-size:20px}.panel{background:#0b2950e9;border:1px solid #9ed5ff8b;border-radius:18px;padding:18px;margin:16px 0}label{display:block;font-weight:700;margin:15px 0 5px}input,textarea,select{width:100%;font:inherit;padding:12px;border-radius:12px;background:#061832;border:1px solid #91ccf2;color:#fff;min-height:48px}textarea{min-height:160px;resize:vertical}button,.link{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;border-radius:12px;background:#175388;border:1px solid #92ceef;color:white;font:700 15px system-ui;text-decoration:none;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.nav,.actions{display:flex;flex-wrap:wrap;gap:9px}.actions{margin-top:18px}.warn{color:#ffe4a5}.status{padding:12px;border:1px solid #9ed5ff80;border-radius:12px;background:#0b2b52}.preview{white-space:pre-wrap;overflow-wrap:anywhere;color:#e6f3ff;border:1px solid #8ec9f7;border-radius:12px;padding:14px}.danger{background:#683747}[hidden]{display:none!important}</style></head><body><main>
<nav class="nav" aria-label="ページ移動"><a class="link" href="/announcements.html">← 公開お知らせへ</a><a class="link" href="/">企画トップへ</a></nav>
<h1>🛡️ お知らせ管理</h1><p>承認済みの管理者だけが編集できます。保存後は公開・非公開を切り替えられます。</p>
<p class="status" id="status" role="status" aria-live="polite">管理者権限を確認しています…</p>
<div class="panel" id="locked" hidden><h2>🔒 管理者認証が必要です</h2><p>この端末は管理者として認証されていません。管理者の端末承認について運営に確認してください。</p></div>
<div id="editor" hidden>
<section class="panel"><h2>お知らせを選ぶ</h2><label for="item">既存のお知らせ</label><select id="item"></select><button type="button" id="new" style="margin-top:12px">＋ 新しいお知らせを作る</button></section>
<section class="panel"><h2 id="editTitle">新規作成</h2><label for="title">タイトル</label><input id="title" maxlength="120" required placeholder="お知らせのタイトル"><label for="body">本文</label><textarea id="body" maxlength="5000" required placeholder="お知らせの内容を入力"></textarea>
<p class="warn" id="publication">新規のお知らせは非公開で保存されます。</p>
<h2>プレビュー</h2><h3 id="previewTitle">タイトル</h3><div class="preview" id="previewBody">本文を入力すると表示されます。</div>
<div class="actions"><button id="save" type="button">内容を保存</button><button id="publish" type="button" disabled>公開する</button><button id="unpublish" type="button" disabled>非公開にする</button><button id="delete" class="danger" type="button" disabled>削除</button></div>
<p class="warn">削除は取り消せません。必要な場合は先に非公開にしてください。</p></section>
</div></main><script>
'use strict';const $=id=>document.getElementById(id);let items=[],active=null,busy=false;const api='/api/gallery/announcements';
function status(s){$('status').textContent=s}
function preview(){$('previewTitle').textContent=$('title').value.trim()||'タイトル';$('previewBody').textContent=$('body').value.trim()||'本文を入力すると表示されます。'}
function fill(id){active=items.find(x=>x.id===id)||null;$('title').value=active?.title||'';$('body').value=active?.body||'';$('editTitle').textContent=active?'お知らせを編集':'新規作成';$('publication').textContent=active?(active.published?'🟢 公開中':'🔒 非公開'):'新規のお知らせは非公開で保存されます。';$('publish').disabled=!active||active.published;$('unpublish').disabled=!active||!active.published;$('delete').disabled=!active;preview()}
function draw(selected){const sel=$('item');sel.replaceChildren();const fresh=document.createElement('option');fresh.value='';fresh.textContent='＋ 新規作成';sel.append(fresh);for(const item of items){const opt=document.createElement('option');opt.value=item.id;opt.textContent=(item.published?'🟢 ':'🔒 ')+item.title;sel.append(opt)}sel.value=selected&&items.some(x=>x.id===selected)?selected:'';fill(sel.value)}
async function load(selected){status('管理者権限とお知らせ一覧を確認中…');try{const r=await fetch(api+'?scope=admin',{cache:'no-store',credentials:'same-origin'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.code||'LOAD_FAILED');if(!d.authorized){$('locked').hidden=false;$('editor').hidden=true;status('🔒 管理者認証が必要です。');return}items=d.items;$('locked').hidden=true;$('editor').hidden=false;draw(selected||'');status('✅ 管理者権限を確認しました。お知らせを編集できます。')}catch(e){$('editor').hidden=true;status('⚠️ お知らせ管理を読み込めません。'+e.message)}}
async function act(action){if(busy)return;const title=$('title').value.trim(),body=$('body').value.trim();if(['create','update'].includes(action)&&(!title||!body)){status('タイトルと本文を入力してください。');return}if(action==='delete'&&!confirm('このお知らせを完全に削除しますか？取り消せません。'))return;if(['publish','unpublish'].includes(action)&&!confirm(action==='publish'?'この内容を公開しますか？':'このお知らせを非公開にしますか？'))return;
busy=true;for(const b of document.querySelectorAll('#editor button'))b.disabled=true;status('保存処理中…');
try{const payload={action,...(active?{id:active.id,revision:active.revision}:{}),...(['create','update'].includes(action)?{title,body}:{})};const r=await fetch(api,{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.code||'SAVE_FAILED');await load(action==='delete'?'':d.item.id);status('✅ 変更を保存しました。'+(action==='publish'?'公開ページに反映されます。':''))}catch(e){status('⚠️ 保存できませんでした。入力内容は維持しています。'+e.message)}finally{busy=false;$('new').disabled=false;$('save').disabled=false;$('publish').disabled=!active||active.published;$('unpublish').disabled=!active||!active.published;$('delete').disabled=!active}}
$('item').addEventListener('change',e=>fill(e.target.value));$('new').addEventListener('click',()=>{$('item').value='';fill('')});$('title').addEventListener('input',preview);$('body').addEventListener('input',preview);$('save').addEventListener('click',()=>act(active?'update':'create'));$('publish').addEventListener('click',()=>act('publish'));$('unpublish').addEventListener('click',()=>act('unpublish'));$('delete').addEventListener('click',()=>act('delete'));load('');
</script></body></html>
