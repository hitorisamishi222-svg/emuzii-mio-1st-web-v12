<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>MIO 運営専用｜ユーリ端末復旧コード発行</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",system-ui,sans-serif}
body{margin:0;min-height:100svh;background:linear-gradient(150deg,#071830,#194b70);color:#f1f9ff;padding:20px}
main{max-width:550px;margin:5vh auto;border:1px solid #80b4e0;border-radius:22px;background:#103456;padding:24px}
h1{font-size:24px}p{line-height:1.7}label{display:block;margin:20px 0 8px}
input,button{box-sizing:border-box;width:100%;font:inherit;min-height:48px;padding:12px;border-radius:12px}
input{background:#fff;color:#17354d;border:0}
button{background:#fbe2a2;color:#143151;border:0;font-weight:800;margin-top:15px;cursor:pointer}button:disabled{opacity:.6}
pre{white-space:pre-wrap;word-break:break-all;background:#081a33;padding:15px;border-radius:10px}
#status{white-space:pre-line;min-height:56px}
small{color:#c5dceb}
</style></head><body><main>
<h1>🐳 みお管理｜ユーリさんのログイン復旧</h1>
<p><strong>対象：</strong>ユーリ／MIO-0017</p>
<p>管理者コードで復旧IDを何度でも発行できます。新しく発行すると、以前の未使用IDは自動的に無効になります。ガチャの残回数や履歴は変更しません。</p>
<form id="form" autocomplete="off">
<label for="adminCode">みおのガチャ管理者コード</label>
<input id="adminCode" type="password" autocomplete="off" required>
<button id="issue" type="submit">復旧IDを発行・再発行する</button></form>
<p id="status" role="status" aria-live="polite"></p>
<div id="result" hidden><p><strong>ユーリさんにだけ個別送信するコード</strong></p>
<pre id="code"></pre><button id="copy" type="button">コードをコピー</button>
<p><small>新しいIDだけが有効です。以前のIDは使えなくなります。有効期限：48時間／1回限り。URL・公開投稿には載せず、ユーリさんに個別送信してください。</small></p>
<p><a href="/device-restore">ユーリさん用の入力画面</a></p></div>
</main><script>
const form=document.getElementById('form'),issue=document.getElementById('issue'),status=document.getElementById('status'),result=document.getElementById('result'),code=document.getElementById('code');
form.addEventListener('submit',async e=>{
 e.preventDefault();if(issue.disabled)return;issue.disabled=true;status.textContent='既存のガチャ権利と管理者承認を確認しています…';
 try{
  const adminCode=document.getElementById('adminCode').value;
  const r=await fetch('/api/yuri-issue',{method:'POST',credentials:'same-origin',cache:'no-store',
   headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'issue',adminCode})});
  document.getElementById('adminCode').value='';
  const d=await r.json();
  if(!r.ok||d.ok!==true)throw Error(d.error||'発行できません');
  if(!/^MIO-REC-[a-f0-9]{32}$/.test(d.recoveryCode||'')||
     !Number.isSafeInteger(d.drawsRemaining)||d.drawsRemaining<0)
    throw Error('発行結果の確認が必要です');
  code.textContent=d.recoveryCode;result.hidden=false;
  status.textContent='発行完了。以前の未使用ID '+Number(d.replacedCount||0)+
   '件を無効化しました。ガチャ残数：'+d.drawsRemaining+
   '回。今表示しているIDだけをユーリさんへ送ってください。';
 }catch(err){status.textContent=err.message+'（発行できなかった場合、前のIDは維持されます）'}
 finally{issue.disabled=false}
});
document.getElementById('copy').onclick=async()=>{
 try{await navigator.clipboard.writeText(code.textContent);status.textContent='コピーしました。ユーリさんにだけ送ってください。'}
 catch{status.textContent='コードを選択してコピーしてください。'}
};
</script></body></html>
