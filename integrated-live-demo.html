<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08142f"><title>翠央1周年｜採用デザイン統合プレビュー</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070f28;color:white;font-family:system-ui,-apple-system,sans-serif}header{padding:10px 12px;background:linear-gradient(110deg,#101e48,#153968);border-bottom:1px solid #d9b76d;display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:15px;margin:0;color:#ffe7ae}small{font-size:11px;color:#b6cce6}nav{display:flex;gap:6px;overflow-x:auto;padding:9px;scroll-snap-type:x proximity;background:#07172f;scrollbar-width:none}button{scroll-snap-align:start;flex-shrink:0;border:1px solid #8ebbe6;background:#143b6b;color:#f3f8ff;border-radius:10px;padding:10px 12px;font-weight:700;font-size:12px;min-height:42px}button.active{background:linear-gradient(#ffe5a3,#dba748);color:#1b2846;border-color:#ffedc0}.notice{font-size:11px;background:#4b301a;padding:7px 12px;color:#ffedc3}.frame{width:100%;height:max(440px,calc(100dvh - 235px));min-height:440px;border:0;background:#07172f}footer{padding:7px 12px;font-size:10px;color:#a6c7e3;background:#07172f}a{color:#ffe0a2}</style><link rel="stylesheet" href="/mio-approved-layout-preview.css"><style id="single-portrait-preview-fix">html,body{background:#07172f!important;background-image:none!important}body::before,body::after{background-image:none!important;content:none!important;display:none!important}iframe.frame{background:#07172f}</style></head><body><header><div><h1>🐳 翠央1周年｜採用デザイン統合プレビュー</h1><small>既存デザインの実画面を切り替えて確認</small></div><small>開発版</small></header><section id="themePlayer" style="padding:9px 13px;background:linear-gradient(100deg,#162c53,#302748);border-bottom:1px solid #d9b76d;color:#ffe6b0;font-size:13px"><strong>🎼 特設サイト テーマソング｜翠の覚醒 -MIO-</strong><div style="font-size:11px;color:#d7d6ec;margin:3px 0 7px">音楽ギャ >b.addEventListener('click',()=>window.mioNavigate(b.dataset.page)));frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;if(!doc)return;doc.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||a.hasAttribute('download')||a.target==='_blank')return;const u=new URL(a.href,location.href);if(u.origin!==location.origin)return;const path=u.pathname==='/'?'home-portrait-next.html':u.pathname.slice(1);if(!/^[a-z0-9-]+[.]html$/i.test(path))return;e.preventDefault();window.mioNavigate(path)},true)}catch(err){console.warn('Preview navigation bridge unavailable',err)}});;(()=>{const audio=document.getElementById('themeAudio'),status=document.getElementById('themeStatus');fetch('/assets/mio-theme-song.mp3',{method:'GET',headers:{Range:'bytes=0-3'},cache:'no-store'}).then(async r=>{const type=r.headers.get('content-type')||'';if(!r.ok||!(/audio|mpeg|octet-stream/i.test(type)))throw Error('missing audio');const bytes=new Uint8Array(await r.arrayBuffer());if(bytes.length<3||!((bytes[0]===73&&bytes[1]===68&&bytes[2]===51)||(bytes[0]===255&&(bytes[1]&224)===224)))throw Error('invalid mp3');audio.style.display='block';status.textContent='テーマソングを再生できます';}).catch(()=>{audio.style.display='none';status.textContent='完成音源をサイトへ配置中です。利用者によるアップロードは不要です'});audio.addEventListener('canplay',()=>{audio.style.display='block';status.textContent='再生準備完了。再生ボタンを押してください'});audio.addEventListener('error',()=>{audio.style.display='none';status.textContent='音源の公開配置が未完了です。現在は再生できません'});if('mediaSession'in navigator&&'MediaMetadata'in window){navigator.mediaSession.metadata=new MediaMetadata({title:'翠の覚醒 -MIO-',artist:'翠央1周年 特設サイト',album:'テーマソング'})}})();</script></body></html>
