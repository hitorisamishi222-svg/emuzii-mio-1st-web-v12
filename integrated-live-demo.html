<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08142f"><title>翠央1周年｜採用デザイン統合プレビュー</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#070f28;color:white;font-family:system-ui,-apple-system,sans-serif}header{padding:10px 12px;background:linear-gradient(110deg,#101e48,#153968);border-bottom:1px solid #d9b76d;display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:15px;margin:0;color:#ffe7ae}small{font-size:11px;color:#b6cce6}nav{display:flex;gap:6px;overflow-x:auto;padding:9px;background:#07172f;scrollbar-width:none}button{flex-shrink:0;border:1px solid #8ebbe6;background:#143b6b;color:#f3f8ff;border-radius:10px;padding:10px 12px;font-weight:700;font-size:12px;min-height:42px}button.active{background:linear-gradient(#ffe5a3,#dba748);color:#1b2846;border-color:#ffedc0}.notice{font-size:11px;background:#4b301a;padding:7px 12px;color:#ffedc3}.frame{width:100%;height:calc(100dvh - 320px);border:0;background:#07172f}footer{padding:7px 12px;font-size:10px;color:#a6c7e3;background:#07172f}a{color:#ffe0a2}</style></head><body><header><div><h1>🐳 翠央1周年｜採用デザイン統合プレビュー</h1><small>既存デザインの実画面を切り替えて確認</small></div><small>開発版</small></header><section id="themePlayer" style="padding:9px 13px;background:linear-gradient(100deg,#162c53,#302748);border-bottom:1px solid #d9b76d;color:#ffe6b0;font-size:13px"><strong>🎼 特設サイト テーマソング｜翠の覚醒 -MIO-</strong><div style="font-size:11px;color:#d7d6ec;margin:3px 0 7px">音楽ギャラリーとは独立・画面切り替え中も再生を維持</div><audio id="themeAudio" controls preload="none" style="width:100%;height:36px;display:block"></audio><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px"><label for="themeFile" style="display:inline-block;background:linear-gradient(#ffe6ac,#c9994d);color:#16264b;font-size:14px;font-weight:800;border-radius:10px;padding:12px 16px;cursor:pointer">📁 MP3ファイルを選ぶ</label><input id="themeFile" aria-label="翠の覚醒のMP3を選択" type="file" accept=".mp3,audio/mpeg,audio/mp3" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden"><span style="font-size:11px;color:#d7d6ec">初回のみ選択してください</span></div><div id="themeStatus" style="font-size:11px;color:#d7d6ec" aria-live="polite">この端末に音源を登録すると再生できます</div></section><nav id="nav"><button data-page="home-portrait-next.html" class="active">🏰 トップ</button><button data-page="mio-royal-whale-v74.html">🐳 王宮クジラ</button><button data-page="integrated-functional-test.html">🧪 連動テスト</button><button data-page="gacha.html">🎰 ガチャ</button><button data-page="attendance-deluxe-demo.html">🏆 皆勤</button><button data-page="mypage-deluxe-demo.html">👤 マイページ</button><button data-page="admin-center-demo.html">⚙️ 管理</button><button data-page="music-gallery-demo.html">🎨 ギャラリー</button><button data-page="next-preview.html">📋 全体</button></nav><div class="notice">⚠️ ガチャ実抽選など本番APIにつながる操作はしないでください。王宮クジラの演出デモは独立動作です。</div><iframe id="frame" class="frame" title="デモ画面" src="home-portrait-next.html" loading="eager"></iframe><footer>各画面は既存開発版。未完成機能や本番API連携の可能性があります。<a id="direct" href="home-portrait-next.html" target="_blank" rel="noopener">選択中の画面を直接開く ↗</a></footer><script>const frame=document.getElementById('frame'),direct=document.getElementById('direct');document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));const p=b.dataset.page;frame.src=p;direct.href=p}));;(()=>{const audio=document.getElementById('themeAudio'),file=document.getElementById('themeFile'),status=document.getElementById('themeStatus');let url=null;const playBlob=blob=>{if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);audio.src=url;audio.load();status.textContent='音源登録済み：再生ボタンで開始できます';if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:'翠の覚醒 -MIO-',artist:'翠央1周年 特設サイト',album:'テーマソング'})}};const request=indexedDB.open('mio-theme-audio-v1',1);request.onupgradeneeded=()=>request.result.createObjectStore('tracks');request.onsuccess=()=>{const db=request.result;const tx=db.transaction('tracks','readonly');const get=tx.objectStore('tracks').get('theme');get.onsuccess=()=>{if(get.result)playBlob(get.result)};file.onchange=()=>{const blob=file.files&&file.files[0];if(!blob)return;if(blob.size>30*1024*1024){status.textContent='30MB以下のMP3を選んでください';return}if(!(/audio|mp3/i.test(blob.type)||/\.mp3$/i.test(blob.name))){status.textContent='MP3を選んでください';return}const write=db.transaction('tracks','readwrite');write.objectStore('tracks').put(blob,'theme');write.oncomplete=()=>playBlob(blob);write.onerror=()=>{status.textContent='保存できませんでした。この画面でのみ再生します';playBlob(blob)}}};request.onerror=()=>{status.textContent='保存領域にアクセスできません。選択した音源はこの画面でのみ再生できます';file.onchange=()=>{const blob=file.files&&file.files[0];if(blob)playBlob(blob)}}})();</script></body></html>
