<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翠央1周年 認証テスト</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 25% 0%,#174475,#08142c 75%);color:#e9f3ff;font-family:system-ui,-apple-system,sans-serif;padding:30px 16px}main{max-width:480px;margin:0 auto;padding:22px;border:1px solid #4b6894;border-radius:24px;background:#142d51e8;box-shadow:0 15px 45px #0006}small{color:#f1dca7;letter-spacing:.12em}h1{font-size:1.55rem}p{line-height:1.7;color:#ccdcf0}.step{margin:10px 0;padding:12px;background:#ffffff0d;border:1px solid #ffffff26;border-radius:12px}.action{width:100%;border:0;background:#e7ca7a;color:#15294c;font-weight:bold;border-radius:13px;padding:13px;font-size:1rem;margin:9px 0}.secondary{color:#e7f0ff;background:transparent;border:1px solid #ffffff44;border-radius:12px;padding:12px;width:100%;font-size:1rem}.info{padding:12px;border-radius:10px;background:#153f66;font-size:.9rem}
</style></head><body><main><small>翠央 1ST ANNIVERSARY / TEST</small><h1>🔐 別ブラウザの自動ログイン</h1><p>現在のブラウザから、別ブラウザを安全に接続する仕組みを作成中です。</p><div class="step">① 認証済みのブラウザから3分間だけ使えるリンクを発行</div><div class="step">② 使いたいブラウザでリンクを開いて認証</div><div class="step">③ MIO-IDに接続し、次回から自動ログイン</div><button class="action" id="example">テスト用の画面の流れを見る</button><p class="info" id="state" role="status">これは説明用の画面です。実際のログイン・データ変更は行いません。</p><button class="secondary" onclick="location.href='/browser-connect.html'">接続確認ページ（テスト画面）を見る</button><p>名前や端末の機種名だけで他人のアカウントにログインできないようにしています。機種変更で元のブラウザを使えないときだけ、管理者への申請が必要です。</p></main><script>let i=0;const stages=['① 元の認証済みブラウザが本人であることを確認','② 3分間有効の接続リンクを発行','③ 別ブラウザで一度だけ認証','④ 既存の皆勤・ガチャ・当選履歴に接続完了'];document.getElementById('example').onclick=()=>{document.getElementById('state').textContent=stages[i%stages.length]+'（画面デモ・データ変更なし）';i++}</script></body></html>
