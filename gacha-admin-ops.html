<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>みお｜Web管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef5f8;font:16px system-ui,sans-serif;color:#173a52}header{background:linear-gradient(135deg,#183d7c,#07949a);color:white;padding:25px 18px}main{max-width:980px;margin:auto;padding:18px 14px}.card{padding:18px;margin-bottom:14px;background:white;border:1px solid #c6dce7;border-radius:16px}.tabs{display:flex;overflow:auto;gap:7px;margin-bottom:15px}button{min-height:47px;padding:11px 16px;border:0;border-radius:10px;background:#12618f;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}input,select,textarea{width:100%;border:1px solid #aac4d6;border-radius:10px;padding:12px;min-height:48px;font:inherit;margin:7px 0 11px}.tabs button{white-space:nowrap;background:#dbeaf4;color:#17496b}.tabs button[aria-selected=true]{background:#154d78;color:white}.pane[hidden]{display:none}.item{border:1px solid #c9dfea;border-radius:12px;padding:13px;margin:10px 0}.item b{display:block}.small{font-size:13px;color:#597083}.notice{padding:12px;background:#e1f2fa;border-radius:10px;margin:12px 0}.err{background:#ffe4e5;color:#762532}.ok{background:#ddf5e8;color:#135b3f}.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}.two>div{background:#edf7fc;padding:16px;border-radius:13px}.big{font-size:24px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}a{color:#146990}@media(max-width:480px){.two{grid-template-columns:1fr}}
</style></head><body><header><h1>🐳 みお Web管理</h1><p>受付・登録承認・回数付与</p><a href="/gacha-web-gate.html" style="color:white">💎 ガチャON/OFFへ</a></header><main>
<section class="card"><h2>🔐 管理者ログイン</h2><input id="code" type="password" autocomplete="off" placeholder="管理者コード"><button id="login">管理データを読み込む</button><p id="status" class="notice">管理コードを入力してください。</p></section>
<nav class="tabs"><button data-tab="home" aria-selected="true">概要</button><button data-tab="approve">承認</button><button data-tab="grant">回数付与</button><button data-tab="intake">初訪問受付</button><button data-tab="history">履歴</button></nav>
<section id="home" class="pane"><div class="card"><h2>管理状況</h2><div class="two"><div>承認待ち<div class="big" id="numPending">―</div></div><div>初訪問未確認<div class="big" id="numIntake">―</div></div></div><p><a href="/gacha-web-gate.html">受付ON/OFF管理画面</a></p></div></section>
<section id="approve" class="pane" hidden><div class="card"><h2>登録承認</h2><p class="small">既存MIO-IDと本人の名前を照合して承認します。</p><div id="pendingList"></div></div></section>
<section id="grant" class="pane" hidden><div class="card"><h2>回数付与</h2><label>参加者</label><select id="person"><option value="">対象を選択</option></select><p>現在の残り：<b id="remaining">―</b> 回 ／ 特別付与：<b id="bonus">―</b> 回</p><label>付与回数（1〜30回）</label><input id="amount" type="number" min="1" max="30" value="1"><label>付与理由</label><input id="reason" maxlength="100" placeholder="例：1周年特典"><button id="grantButton" disabled>確認して付与</button></div></section>
<section id="intake" class="pane" hidden><div class="card"><h2>初訪問受付</h2><label>ColorSing名</label><input id="newName" maxlength="40"><label>メモ</label><textarea id="newNote" maxlength="120"></textarea><button id="intakeButton">受付を登録</button></div><div class="card"><h2>受付記録</h2><div id="intakes"></div></div></section>
<section id="history" class="pane" hidden><div class="card"><h2>付与履歴</h2><button id="historyRefresh">履歴を更新</button><div id="historyList"></div></div></section></main><script src="/mio-ops-page.js"></script></body></html>
