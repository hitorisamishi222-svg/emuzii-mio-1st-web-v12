<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>音楽ギャラリー｜翠央1周年 TEST</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#061632,#113c76);color:#f4fbff;font-family:system-ui,-apple-system,sans-serif}main{max-width:620px;margin:auto;padding:22px 15px 70px}a{color:#9fe5ff}.panel{background:#061c40e8;border:1px solid #83d5ff80;border-radius:20px;padding:19px;margin:15px 0}h1{font-size:25px}h2{font-size:18px}label{display:block;margin:14px 0 5px;font-weight:700}input,select,button{font:inherit}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #8cbbef;background:#f5faff;color:#0a244a}button{background:#f5d68b;color:#071b3b;border:0;border-radius:13px;padding:13px 18px;font-weight:900;margin-top:15px}button:disabled{opacity:.45}small,p{line-height:1.7}.preview{width:100%;max-height:260px;object-fit:cover;border-radius:13px;margin:12px 0}audio{width:100%}.muted{color:#b6d5ed;font-size:12px}.error{color:#ffb5b5}.track{padding:14px;border-radius:14px;background:#15335e;margin-top:12px}</style></head><body><main><a href="/next-preview.html">← 大型更新トップへ</a><h1>🎵 オリジナル音楽ギャラリー</h1><p class="muted">次期版・安全な投稿UIデモ。実際の会員資格確認・サーバー保存・公開処理は未接続です。</p><section class="panel"><h2>🎼 作品を登録（会員限定の想定）</h2><label for="role">権限確認（デモ切替）</label><select id="role"><option value="guest">一般ユーザー</option><option value="member">メンバーシップ会員（デモ）</option></select><form id="form"><label for="title">作品名</label><input id="title" maxlength="80" required placeholder="例：翠の覚醒"><label for="artist">投稿者名</label><input id="artist" maxlength="40" required placeholder="例：えむじー🐱"><label for="audio">自作音楽ファイル</label><input id="audio" type="file" accept=".mp3,.m4a,.aac,.wav,.flac,.ogg,.oga,.opus,audio/*" required><p class="muted">MP3 / M4A / AAC / WAV / FLAC / OGG / OPUS。ブラウザによって再生可能な形式が異なります。デモ上限30MB。</p><label for="thumb">サムネイル画像（任意）</label><input id="thumb" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><label><input id="rights" type="checkbox" required style="width:auto"> 自作曲であり、投稿・公開に必要な権利を持っています</label><button id="submit" type="submit" disabled>審査用プレビューを作成</button><p id="message" role="status" class="muted">メンバーシップ会員のみ投稿できます。</p></form></section><section class="panel"><h2>🎧 この端末のプレビュー</h2><div id="tracks"><p class="muted">まだ作品はありません。</p></div><p class="muted">この画面を閉じると選択したファイルのプレビューは消えます。実際の投稿・審査待ち登録ではありません。</p></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),role=$('role'),button=$('submit'),message=$('message'),tracks=$('tracks');let urls=[];role.addEventListener('change',()=>{button.disabled=role.value!=='member';message.textContent=button.disabled?'メンバーシップ会員のみ投稿できます。':'会員の画面デモです。実際の会員認証は行っていません。'});$('form').addEventListener('submit',e=>{e.preventDefault();if(role.value!=='member'){message.textContent='会員のみ投稿可能です';return}const file=$('audio').files[0],thumb=$('thumb').files[0];if(!file||file.size>30*1024*1024||!['mp3','m4a','aac','wav','flac','ogg','oga','opus'].includes((file.name.split('.').pop()||'').toLowerCase())){message.textContent='対応する30MB以下の音楽ファイルを選択してください';return}if(thumb&&(!['image/jpeg','image/png','image/webp','image/gif'].includes(thumb.type)||thumb.size>5*1024*1024)){message.textContent='画像はJPEG・PNG・WebP・GIF、5MB以下にしてください';return}const el=document.createElement('article');el.className='track';const h=document.createElement('h3');h.textContent=$('title').value.trim();const p=document.createElement('p');p.textContent='投稿者：'+$('artist').value.trim()+' ／ 審査前プレビュー';el.append(h,p);if(thumb){const img=document.createElement('img');img.className='preview';img.alt='作品サムネイル';img.src=URL.createObjectURL(thumb);urls.push(img.src);el.append(img)}const player=document.createElement('audio');player.controls=true;player.preload='metadata';player.src=URL.createObjectURL(file);urls.push(player.src);el.append(player);if(tracks.querySelector('p'))tracks.textContent='';tracks.prepend(el);message.textContent='この端末だけで再生プレビューを作成しました。サーバーには送信していません。'});window.addEventListener('pagehide',()=>urls.forEach(u=>URL.revokeObjectURL(u)));})();</script></body></html>
