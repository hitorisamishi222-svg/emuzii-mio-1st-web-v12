<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>王宮クジラガチャ v74</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#071d53,#030b25);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#fff}
main{max-width:560px;margin:auto;padding:12px 10px 32px}.heading{text-align:center;color:#ffe8a3;font-weight:900;font-size:clamp(17px,4.5vw,23px);padding:6px}
.stage{position:relative;width:100%;aspect-ratio:1;overflow:hidden;border:2px solid #d9ad55;border-radius:20px;isolation:isolate;background:#103774}
.art{width:100%;height:100%;display:block}
.glitter{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(circle at 50% 45%,#fff9 0%,#a3e7ff44 18%,transparent 50%);mix-blend-mode:screen}
.stage.shining .glitter{opacity:1;animation:pulse .65s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.42}}
.spark{position:absolute;z-index:3;pointer-events:none;width:9px;height:9px;background:#fff9df;transform:rotate(45deg);box-shadow:0 0 12px 5px #7be8ff;border-radius:1px;animation:twinkle .85s ease-in-out infinite alternate;opacity:0}
.stage.shining .spark{opacity:1}
@keyframes twinkle{to{transform:rotate(45deg) scale(.18);opacity:.15}}
.handle{position:absolute;left:50%;top:69.3%;width:19%;height:19%;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;cursor:pointer;z-index:5;touch-action:manipulation}
.handle:focus-visible{outline:3px solid #fff}.stage.shining .handle{animation:turn .7s ease-in-out 2}
@keyframes turn{50%{transform:translate(-50%,-50%) rotate(115deg)}}
/* Lightweight two-piece capsule: no WebGL, canvas or physics */
.prize{position:absolute;z-index:7;left:50%;top:83%;width:16%;aspect-ratio:1;transform:translate(-50%,-130%) scale(.25);opacity:0;pointer-events:none;filter:drop-shadow(0 0 10px #90d9ff)}
.cap-half{position:absolute;left:0;width:100%;height:51%;border:2px solid #ffe5a3;background:linear-gradient(125deg,#fff9,#6ad7ff 43%,#2363b9 88%);box-shadow:inset 0 2px 9px #fff8;transition:transform .6s cubic-bezier(.15,.8,.25,1),opacity .6s}
.cap-top{top:0;border-radius:90px 90px 6px 6px;border-bottom:3px solid #e9b85e;transform-origin:bottom center}
.cap-bottom{bottom:0;border-radius:6px 6px 90px 90px;border-top:3px solid #e9b85e;background:linear-gradient(145deg,#5bbcf4,#243d9d)}
.cap-gem{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(20px,6vw,34px);opacity:0;transform:scale(.3);transition:transform .55s ease,opacity .4s}
.prize.drop{animation:drop 1.25s cubic-bezier(.28,.55,.28,1) forwards}
@keyframes drop{
0%{opacity:0;transform:translate(-50%,-195%) scale(.56)}
18%{opacity:1;transform:translate(-50%,-150%) scale(.83)}
58%{opacity:1;transform:translate(-50%,5%) scale(1)}
73%{transform:translate(-50%,-33%) scale(1.02)}
85%{transform:translate(-50%,-4%) scale(.98)}
93%{transform:translate(-50%,-16%) scale(1)}
100%{opacity:1;transform:translate(-50%,-8%) scale(1)}
}
.prize.opening .cap-top{transform:translate(-16%,-62%) rotate(-18deg);opacity:.95}
.prize.opening .cap-bottom{transform:translate(10%,44%) rotate(11deg);opacity:.95}
.prize.opening .cap-gem{opacity:1;transform:scale(1.1)}
.panel{margin-top:12px;padding:16px 12px;border:2px solid #dcb568;border-radius:20px;background:#10275b;text-align:center}
#status{font-size:16px;font-weight:700;min-height:30px}button{font-family:inherit}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;min-width:0;border:1px solid #fff4c4;border-radius:14px;padding:14px 5px;font-weight:800;font-size:clamp(13px,3.3vw,16px);cursor:pointer;color:#123263;background:linear-gradient(#fff6d7,#e6ae3e)}.actions button.secondary{background:linear-gradient(#e8f6ff,#88bbf7)}button:disabled{opacity:.45;cursor:not-allowed}
.small{font-size:12px;color:#c9d7ed;margin:12px 3px;line-height:1.7}
dialog{border:2px solid #f5d48a;border-radius:23px;background:linear-gradient(160deg,#183f91,#07163d);color:#fff;text-align:center;width:min(90vw,370px);padding:24px 16px;box-shadow:0 0 50px #71bfff88}dialog::backdrop{background:#020b27c9}dialog h2{color:#ffdfa0}.diamond{font-size:68px;filter:drop-shadow(0 0 17px #8edaff)}dialog button{border:0;background:#f2c763;border-radius:12px;padding:12px 30px;font-weight:800;color:#182653}
@media(prefers-reduced-motion:reduce){.spark,.glitter,.handle{animation:none!important}}

/* v74: clearly visible mechanical trigger, staged shine, mobile-safe result */
.handle{border:2px solid rgba(255,237,169,.85);box-shadow:0 0 0 3px #16387399,0 0 16px #ffd46e80;background:radial-gradient(circle at 35% 30%,#ffffff50,transparent 65%)}
.handle::after{content:"↻";display:grid;place-items:center;position:absolute;right:-8%;bottom:-10%;width:35%;aspect-ratio:1;border-radius:50%;background:#f5d17c;color:#14306a;font-size:clamp(14px,4vw,22px);box-shadow:0 2px 7px #0008}
.stage.shining{box-shadow:inset 0 0 30px #a6edff,0 0 18px #f6dc92}
.stage.shining .art{animation:artflash .6s ease-in-out 2 alternate}
@keyframes artflash{to{filter:brightness(1.18) saturate(1.08)}}
.prize.opening .cap-gem{animation:gem-pop .55s ease-out both}
@keyframes gem-pop{from{transform:translateY(12px) scale(.2);opacity:0}65%{transform:translateY(-7px) scale(1.3);opacity:1}to{transform:translateY(0) scale(1.05);opacity:1}}
@media(prefers-reduced-motion:reduce){.stage.shining .art,.prize.opening .cap-gem{animation:none!important}}
 .history{margin-top:12px;padding:12px;border:1px solid #b9a575;border-radius:12px;background:#071b43;text-align:left;font-size:13px;line-height:1.8}.history strong{color:#ffe4a0}.history div{margin-top:4px;color:#e6efff} @media(prefers-reduced-motion:reduce){.stage.shining .glitter,.stage.shining .spark,.stage.shining .handle,.prize.drop{animation-duration:.01ms!important;animation-iteration-count:1!important}} </style><style id="royal-prize-preview-style">.royal-mode-tabs{display:flex;gap:8px;justify-content:center;margin:10px auto}.royal-mode-tabs button{flex:1;max-width:220px;padding:12px 8px;border-radius:12px;border:2px solid #d8ad61;background:#102e64;color:#fff;font-weight:800}.royal-mode-tabs button[aria-pressed="true"]{background:#f7dc9b;color:#123366}.royal-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}.royal-gallery button{background:#10234c;color:#fff;border:1px solid #bca26d;border-radius:12px;padding:7px;min-width:0}.royal-gallery img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.royal-gallery span{display:block;font-size:11px;overflow-wrap:anywhere}.royal-gallery button:focus-visible{outline:3px solid #fff}.royal-preview-note{text-align:center;font-size:12px;color:#e8dcbb;padding:10px}.stage .handle{z-index:7}dialog img{background:#071735}</style></head><body><main><div class="heading">🐳 王宮クジラガチャ 💎 v74</div>

<div class="small">v74｜王宮クジラ・ハンドル連動・カプセル開封・景品27種類の開発プレビュー。抽選権・MIO-IDとは未接続です。</div></main>
<dialog id="result"><img id="royalPrizeImage" alt="獲得景品画像" style="display:block;max-width:min(78vw,270px);max-height:42vh;object-fit:contain;margin:auto;border-radius:14px"><h2 id="royalPrizeName">景品をゲット！</h2><p id="royalPrizeRarity">王宮クジラからの贈り物 ✨</p><button id="close">閉じる</button></dialog>
<script>
(()=>{'use strict';
const skip=document.getElementById("skip");const historyItems=document.getElementById('history-items');const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=document.getElementById('stage'),spin=document.getElementById('spin'),handle=document.getElementById('handle'),reset=document.getElementById('reset'),prize=document.getElementById('prize'),status=document.getElementById('status'),result=document.getElementById('result'),count=document.getElementById('count');
let busy=false,turns=0,timers=[];
const royalPrizeImage=document.getElementById('royalPrizeImage');const royalPrizeName=document.getElementById('royalPrizeName');const royalPrizeRarity=document.getElementById('royalPrizeRarity');const royalGallery=document.getElementById('royalGallery');const royalNormal=document.getElementById('royalNormal');const royalLucky=document.getElementById('royalLucky');let royalPrizes=[],royalMode='通常',royalSelected=null;
function royalRender(){const pool=royalPrizes.filter(p=>p.mode===royalMode);royalGallery.replaceChildren();for(const p of pool){const button=document.createElement('button');button.type='button';button.setAttribute('aria-pressed',String(royalSelected?.id===p.id));const image=document.createElement('img');image.src=p.imagePath;image.loading='lazy';image.alt=p.name;const label=document.createElement('span');label.textContent=p.id+' '+p.rarity+' '+p.name;button.append(image,label);button.addEventListener('click',()=>{if(busy)return;royalSelected=p;royalRender();status.textContent='選択：'+p.name+'。ハンドルを回してね！';});royalGallery.append(button)}}
function royalSwitch(mode){if(busy)return;royalMode=mode;royalSelected=royalPrizes.find(p=>p.mode===mode)||null;royalNormal.setAttribute('aria-pressed',String(mode==='通常'));royalLucky.setAttribute('aria-pressed',String(mode==='ラキフェス'));royalRender()}
royalNormal.addEventListener('click',()=>royalSwitch('通常'));royalLucky.addEventListener('click',()=>royalSwitch('ラキフェス'));
fetch('/data/gacha-prizes-v2-preview.json').then(r=>{if(!r.ok)throw Error('prize data '+r.status);return r.json()}).then(data=>{royalPrizes=data.prizes.filter(p=>p.enabled&&typeof p.imagePath==='string'&&(p.imagePath.startsWith('/gacha-mem-')||p.imagePath.startsWith('/gacha-lf-'))&&p.imagePath.endsWith('.jpg'));if(royalPrizes.length!==27)throw Error('27 images not available');royalSwitch('通常');status.textContent='27種類の景品を読み込みました。ハンドルを回してね 💕'}).catch(e=>{status.textContent='景品データの読み込みに失敗：'+e.message;spin.disabled=true;handle.disabled=true});

function later(fn,ms){const id=setTimeout(fn,ms);timers.push(id)}
function clear(){timers.forEach(clearTimeout);timers=[];busy=false;stage.classList.remove('shining');prize.classList.remove('drop','opening');void prize.offsetWidth;spin.disabled=false;handle.disabled=false;skip.disabled=true}
function finish(){if(!busy)return;timers.forEach(clearTimeout);timers=[];stage.classList.remove('shining');prize.classList.add('drop','opening');busy=false;turns++;count.textContent='デモ抽選：'+turns+'回';const p=royalSelected;if(!p)return;royalPrizeImage.src=p.imagePath;royalPrizeName.textContent=p.name;royalPrizeRarity.textContent=p.mode+'・'+p.rarity+'（演出確認）';const item=document.createElement('div');item.textContent='🎁 '+turns+'回目：'+p.name;if(turns===1)historyItems.textContent='';historyItems.prepend(item);while(historyItems.children.length>5)historyItems.lastElementChild.remove();spin.disabled=false;handle.disabled=false;skip.disabled=true;status.textContent='🎁 '+p.name+' を表示！';if(!result.open){if(typeof result.showModal==='function')result.showModal();else result.setAttribute('open','')}}
function run(){if(busy||!royalSelected)return;clear();busy=true;spin.disabled=true;handle.disabled=true;skip.disabled=false;if(result.open)result.close();status.textContent='✨ 王宮の宝石が輝いているよ…';stage.classList.add('shining');
if(reduced){later(finish,100);return;}later(()=>{stage.classList.remove('shining');status.textContent='🎁 カプセルが出てくるよ！';prize.classList.add('drop')},1550);
later(()=>{prize.classList.add('opening');status.textContent='✨ カプセルがパカッと開いたよ！'},3000);
later(finish,3900)}
spin.addEventListener('click',run);handle.addEventListener('click',run);
skip.addEventListener('click',finish);
reset.addEventListener('click',()=>{clear();if(result.open)result.close();status.textContent='準備OK！ ハンドルを回してね 💕'});
document.getElementById('close').addEventListener('click',()=>result.close());
})();
</script></body></html>
